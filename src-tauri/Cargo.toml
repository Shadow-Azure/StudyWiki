[package]
name = "study-wiki"
version = "0.1.0"
description = "StudyWiki — offline markdown + video study client"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "study_wiki_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Smaller, self-contained binaries: no dynamic deps on the host toolchain.
strip = true
lto = true
codegen-units = 1
