feature: |
  用户可以在文件树点开 `.xlsx`，按工作表切换阅读；表格支持虚拟滚动、常用字体、填充、边框、对齐、数字/日期格式、合并单元格、列宽和空表提示。不支持的 csv、老式 `.xls`、`.xlsm` 保留在树中并给出明确反馈。
userFlow:
  - 在文件树点击 `.xlsx` 文件，主区出现表格视图并显示首个工作表。
  - 点击顶部工作表标签切换 sheet。
  - 上下滚动大表，只渲染可视行窗口，样式与合并单元格保持。
  - 点击 `.csv` 或老式 `.xls`，主区显示不支持预览的提示。
architectural: |
  xlsx 语义归前端：ExcelJS workbook 是唯一读写模型；Rust 只负责字节读写、路径授权和原子落盘。表格能力独立为第七个宿主服务 `ctx.excel`，人与后续 AI 能力共用同一读写契约。
