  用户可以直接在表格页编辑单元格值，并使用加粗、斜体、字体色、填充色和合并控件；支持单击加 Shift 单击矩形选区。修改后的工作簿经脏标记与关窗守卫确认保存，重开仍保留数据与样式。
userFlow:
