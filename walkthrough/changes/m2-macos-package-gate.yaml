codeMap:
  - group: 安装包门禁
    attention: must-read
    why: 结构、身份、签名与标准启动共同决定用户双击后能否打开。
    files:
      - path: scripts/verify-macos-package.mjs
        note: macOS DMG 安装启动门禁：定位、挂载、复制、结构、plist、codesign、open 与清理。
        changes:
          - snippet: |
              export function collectBundleErrors(app) {
                const required = [
                  "Contents/Info.plist",
                  "Contents/MacOS/study-wiki",
                  "Contents/Resources/icon.icns",
                  "Contents/_CodeSignature/CodeResources",
                ];
                return required
                  .filter((relative) => !existsSync(path.join(app, relative)))
                  .map((relative) => `缺少 ${relative}`);
              }
            note: |
              结构检查先于 codesign，明确列出缺失的 bundle 部件；资源封条文件也作为必需结构，避免等到签名验证才得到模糊错误。
          - snippet: |
              const plistPath = path.join(installedApp, "Contents/Info.plist");
              const plistJson = await run("/usr/bin/plutil", ["-convert", "json", "-o", "-", plistPath]);
              const identity = plistIdentityErrors(JSON.parse(plistJson.stdout), conf.identifier);
              if (identity.length > 0) throw new Error(`安装包身份不一致：\n  ${identity.join("\n  ")}`);

              await run("/usr/bin/codesign", ["--verify", "--deep", "--strict", installedApp]);
              await verifyStandardLaunch(installedApp);
            note: |
              安装后的 plist 必须与构建配置一致，随后才验证签名和标准启动。检查对象是复制到临时 Applications 的 app，而不是挂载卷上的只读副本。
          - snippet: |
              await run("/usr/bin/open", ["-n", "-g", installedApp]);
              const deadline = Date.now() + 10_000;
              while (Date.now() < deadline) {
                const fresh = (await pidsFor(binary)).filter((pid) => !before.has(pid));
                if (fresh.length > 0) {
                  await sleep(750);
                  const alive = (await pidsFor(binary)).filter((pid) => fresh.includes(pid));
                  if (alive.length === 0) throw new Error("应用进程在 Launch Services 启动后立即退出");
                  for (const pid of alive) process.kill(pid, "SIGTERM");
                  return;
                }
                await sleep(250);
              }
              throw new Error("标准 open 未在 10 秒内启动应用进程");
            note: |
              标准启动用 `open -n -g`，记录启动前 PID 集合，只把新增进程当作本次启动结果；出现后再观察 750ms，避免捕获到启动即崩溃的假阳性。
      - path: scripts/verify-env-independence.mjs
        note: 静态配置的身份规则：reverse-DNS 且禁止 `.app` 结尾。
        changes:
          - snippet: |
              export function isStableBundleIdentifier(identifier) {
                return typeof identifier === "string"
                  && /^[a-z][a-z0-9-]*(?:\.[a-z][a-z0-9-]*)+$/i.test(identifier)
                  && !identifier.toLowerCase().endsWith(".app");
              }
            note: |
              配置与安装包共用同一身份判定：至少两层点分段、字母开头，并显式拒绝 `.app` 后缀，避免 bundle id 与应用扩展名混淆。
  - group: CI 接线与发布说明
    attention: skim
    why: 工作流只负责在正确平台调用门禁，失败传播由命令退出码保证。
    files:
