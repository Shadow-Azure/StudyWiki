reviewGuide:
  order:
    - 先读 `verify-macos-package.mjs` 的 `verifyPackage`：确认挂载、复制、检查与清理顺序。
    - 再读 `collectBundleErrors` 与 `plistIdentityErrors`：确认失败信息指向具体 bundle 部件。
    - 接着读 `verifyStandardLaunch`：确认只把新增 PID 当作本次启动证据。
    - 然后读 `verify-env-independence.mjs`：配置侧和安装包侧共享身份规则。
    - 最后读两条 workflow：PR 与 release 都必须在上传前失败即中止。
  risks:
    - 如果 `open` 后只检查任意 study-wiki 进程存在，已有实例会掩盖本次启动失败；当前实现用启动前 PID 集合做差。
    - 如果失败路径跳过 detach，CI 会残留挂载卷并影响后续步骤；清理在 finally 中执行。
    - 如果 ad-hoc 签名被误换成无签名，结构文件可能存在但资源封条不完整，`codesign --deep --strict` 必须继续作为硬门禁。
  acceptance:
    - item: 配置门禁拒绝 `.app` 结尾或非 reverse-DNS identifier
      evidence: scripts/verify-env-independence.spec.mjs
    - item: 门禁覆盖 DMG 查找、应用定位、结构与 plist 身份
      evidence: scripts/verify-macos-package.spec.mjs
    - item: 安装后的 app 能通过 codesign 与标准 open 启动
      evidence: `pnpm verify:macos-package <dmg>`；PR #54 的 macOS CI
    - item: PR 与 release macOS lane 在上传前执行门禁
      evidence: .github/workflows/ci.yml、.github/workflows/release.yml
