kind: change
issue: m2-macos-package-gate
skill_gen_commit_id: 20c20f5
title: #55 macOS DMG 安装启动门禁
scale:
  files: 10
  additions: 335
  deletions: 14
feature: |
  发布链路不再把“DMG 构建成功”当作安装可用。macOS 产物会先被复制到隔离目录，核对应用结构、bundle 身份与 ad-hoc 签名，再通过 Finder 同源的 `open` 启动并确认进程存活；任何一步失败都会在上传产物前中止。

  ![DMG 安装启动门禁](../assets/m2-macos-package-gate/dmg-launch-gate.svg)

  *图 1：DMG 挂载、隔离安装、身份与签名检查、标准启动和清理的发布顺序。*
userFlow:
  - 开发者推送 PR 或发布 tag → macOS lane 构建 DMG → 产物进入隔离验证。
  - 门禁挂载 DMG 并把 StudyWiki.app 复制到临时 Applications → 验证从安装位置启动，而不是从只读挂载卷直接运行。
  - 门禁读取 Info.plist → 核对 reverse-DNS identifier、可执行文件名与产品名 → 身份不一致立即失败。
  - 门禁执行 `codesign --verify --deep --strict` → 资源封条不完整立即失败 → 不上传损坏产物。
  - 门禁用标准 `open -n -g` 启动 → 10 秒内必须观察到新进程存活 → 成功后才结束并清理临时目录。
architectural: |
  新增 `scripts/verify-macos-package.mjs`，把 DMG 查找、应用定位、结构检查、plist 身份、codesign、标准启动和清理收敛为一条可测试的发布门禁。`verify-env-independence` 继续负责静态配置约束，新增共享的 bundle identifier 判定，避免配置检查与安装包检查对“合法身份”给出不同答案。

  沿图 2：构建产物先挂载，再复制到隔离目录；结构、plist、签名与标准启动按失败成本从低到高排列，能在进入 Launch Services 前指出缺哪个 bundle 部件。无论成功或失败都执行 detach 与临时目录删除，失败不会留下挂载卷。

  结构变化还包括 CI 接线：PR 的 `macos-package` lane 与 release 的 macOS lane 都在上传前调用同一脚本。原来的“产物非空”检查继续保留，但不再承担安装启动验证。
