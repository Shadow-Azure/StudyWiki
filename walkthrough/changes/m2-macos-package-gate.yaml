design: |
  ### 问题与约束
  - DMG 能生成、应用包内文件齐全，不代表 Finder 能启动；缺失资源封条时 `codesign` 会失败，标准打开可能返回 `kLSNoExecutableErr`。
  - bundle identifier 以 `.app` 结尾会与 macOS 应用包扩展名冲突，必须由静态配置门禁和安装包检查共同拒绝。
  - 发布机不一定有开发者证书；无证书时仍需产出可被 Launch Services 识别的应用包。

  ### 候选方案
  - 只检查 DMG 非空：实现最省事，但无法发现签名封条和应用身份问题。
  - 直接运行 `Contents/MacOS/study-wiki`：可验证二进制，却绕过 Finder 与 Launch Services 的标准路径。
  - 强制真实开发者证书：身份最正式，但无证书分发场景会直接失去产物。
  - 隔离安装 + ad-hoc 签名 + 标准 `open` 冒烟：覆盖真实双击路径，允许无证书分发，代价是 macOS CI 时间增加。

  ### 选型与理由
  选择隔离安装与标准启动验证。`Info.plist`、`_CodeSignature/CodeResources` 和可执行文件先做结构检查，失败信息能直接指出缺失部件；随后才做 `codesign` 和 `open`，避免把 Launch Services 的模糊错误当成唯一信号。ad-hoc identity 写成 `-`，在没有开发者证书时仍形成完整封条。

  ### 关键权衡与边界
  - 该门禁只在 macOS 执行，不能替代 Windows/Linux 安装器冒烟。
  - 标准 `open` 验证的是“新进程出现并存活 10 秒”，不覆盖应用内功能；应用功能仍由 Computer Use 与其他测试验证。
  - 若未来启用真实开发者签名，只需替换 identity，不必改变安装与启动链路。

  ### 落地映射：功能点 → 变更文件
  #### bundle 身份与标准启动验证

  沿图「bundle 身份与标准启动验证」：静态配置先拒绝非法 identifier，发布脚本再在安装后的 app 上读取 plist、校验签名并走标准 `open`。共享判定函数让配置门禁与安装包门禁对 bundle 身份使用同一规则。

  ```text
  scripts/
    ├─ verify-env-independence.mjs 配置侧：reverse-DNS、禁止 .app 结尾
    ├─ verify-env-independence.spec.mjs 身份规则回归
    ├─ verify-macos-package.mjs    DMG 安装、结构、签名与标准启动
    └─ verify-macos-package.spec.mjs DMG/应用定位与结构检查
  .github/workflows/
    ├─ ci.yml      PR macOS lane 构建并执行安装冒烟
    └─ release.yml release macOS lane 在上传前执行同一门禁
  src-tauri/tauri.conf.json  dev.studywiki.desktop + ad-hoc signingIdentity
  docs/release-checklist.*   发布前人工检查与机械门禁入口
  ```
