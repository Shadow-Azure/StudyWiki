design: |
  ### 问题与约束
  - 工具过程平铺会让长回合淹没助手结论；审批大卡既占空间，又在决策后留下大块历史噪声。
  - `agent-core` 的会话、工具协议与 JSONL 契约不能为 UI 改形；历史记录只提供 `assistant.toolCalls`，没有独立工具结果行。
  - Esc、⌘/Ctrl+Enter 同时可能被插件模态、模型浮层和审批占用，必须有一个窗口级所有权栈。

  ### 候选方案
  - 保留 transcript 审批大卡，仅压缩样式：改动小，但决策后仍占据主阅读区，焦点与决策位置分离。
  - 每个工具调用单独折叠，不建回合组：实现简单，但用户仍需在多个摘要之间拼出一条执行链。
  - 回合级过程组 + composer 审批接管：默认只留结论与耗时，审批出现在准备发送的位置，代价是 DOM 状态机和事件生命周期更复杂。

  ### 选型与理由
  选择回合级过程组与 composer 三态。过程组直接以 `turn-start` 和 `turn-end` 为边界，不需要推断工具之间的业务关系；composer 保存草稿后替换子树，决策完成再恢复，既不污染 `agent-core`，也不让审批离开当前工作区。

  ### 关键权衡与边界
  - 历史动作结果只能显示占位说明，因为 JSONL 不保存工具结果内容；页面不伪造已丢失的数据。
  - 多个审批逐个展示，`decided` 只停 400ms；中断会清空当前与排队审批，避免对已取消请求继续操作。
  - 浮层出现时 agent 快捷键让路，关闭后订阅回调再展示下一条审批；快捷键不会穿透到下层。

  ### 落地映射：功能点 → 变更文件
  #### 回合折叠与审批接管

  沿图「回合折叠与审批接管」：流式快照与工具事件先进入过程组，审批请求排队后由 normal composer 取队首；决策写一行记录，经过 decided 短态再恢复草稿并展示下一条。状态机住在 `app-agent`，渲染件保持无状态。

  ```text
  src/plugins/app-agent/
    ├─ index.ts     事件接线、审批队列、composer 状态机、快捷键与清理
    ├─ render.ts    过程组、决策行、审批摘要与详情浮层的 DOM 渲染
    └─ attachments.ts 多模态草稿的既有输入面
  src/ui/
    ├─ active-layer.ts 窗口级浮层所有权栈：一次 Escape 只交给顶层
    └─ icons.ts        面板开关图标
  src/styles.css     过程组、审批台、toast、宽窄 composer 与响应式布局
  tests/
    ├─ app-agent.test.ts        编排、审批排队、停止清理与草稿恢复
    ├─ app-agent-render.test.ts 无状态渲染结构与详情浮层
    └─ active-layer.test.ts     浮层层序与快捷键所有权
  ```
