feature: |
  用户在右栏发送一轮 agent 任务时，工具调用默认收进一个可展开的过程组，只显示当前动作或完成摘要；当 agent 请求写文件、编辑或越权读取时，输入区切换成审批台，用户能查看摘要、详情，用按钮或快捷键批准、拒绝，并在决策后拿回原草稿。

  ![Agent composer 与回合状态](../assets/m2-agent-ui-v2/composer-turn-state.svg)

  *图 1：输入区三态与回合收尾共用同一套事件清理语义。*
userFlow:
  - 用户在右栏发送任务 → `turn-start` 建立过程组 → 看到“正在执行 <工具>”或已完成动作摘要。
  - 用户展开过程组 → 工具卡按执行顺序展开 → 再次点击即可收起，结论不被过程噪声淹没。
  - agent 请求写入或读取库外文件 → composer 进入审批态并保存草稿 → 用户看到请求摘要、详情入口和批准/拒绝按钮。
  - 用户点击“查看详情”或按 Esc → 先处理详情浮层；浮层关闭后 Esc 才拒绝审批 → 一次键盘动作只表达一个安全语义。
  - 用户批准/拒绝 → 对话流写入一行决策记录，composer 短暂显示 decided → 400ms 后恢复原草稿，并展示下一条排队审批。
  - 回合运行中用户点停止 → 当前和排队审批被清空，composer 恢复 normal → 过程组收成“回合已中断”。
architectural: |
  `app-agent` 继续只承担右栏 UI，不改变 `agent-core` 的会话、工具和审批协议。结构变化集中在一个插件内部：过程组成为 transcript 的回合级容器，composer 成为审批交互的唯一入口，窗口级 `ActiveLayerStack` 负责浮层与快捷键的所有权。

  沿图 2：`turn-start` 建立过程组，`tool-start`/`tool-end` 更新当前动作和步数，`turn-end`/`aborted`/`error` 分别收组成完成、中断和出错。审批不插入 transcript，而是进入队列；仅在 composer 为 normal 且没有更高层浮层时取队首接管输入区。

  语义变化是审批决策的可见位置：历史记录只保留一行 `renderDecisionLine`，详细请求留在需求发生时的 composer 浮层。这样用户阅读历史时先看到结论，需要追溯时再展开过程或查看审批详情。
