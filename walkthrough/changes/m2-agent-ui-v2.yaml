codeMap:
  - group: 回合与审批状态机
    attention: must-read
    why: 事件顺序、审批排队和中断清理共同决定用户看到的行为是否正确。
    files:
      - path: src/plugins/app-agent/index.ts
        note: 右栏插件的事件编排器：维护过程组、审批队列、composer 三态、快捷键与生命周期清理。
        changes:
          - snippet: |
              case "aborted":
                turnRunning = false;
                approvalQueue = [];
                activeApproval = null;
                approvalDetail?.remove();
                approvalDetail = null;
                approvalToggle = null;
                if (decideTimer) {
                  clearTimeout(decideTimer);
                  decideTimer = null;
                }
                if (composerEl?.dataset.state && composerEl.dataset.state !== "normal") restoreComposer();
                messageQueue = [];
                renderQueue();
                processGroup?.settle("回合已中断", Date.now() - turnStartedAt);
                processGroup = null;
                appendInterrupted();
                finishActive();
                paintButtons();
                break;
            note: |
              aborted 是同一条清尾路径：清空当前与排队审批、取消延迟展示、恢复 composer、清空未发送队列，再把过程组 settle 为已中断，避免已经失效的审批继续接受操作。
          - snippet: |
              const presentNextApproval = (): void => {
                if (
                  disposed || !composerEl || !panel ||
                  composerEl.dataset.state !== "normal" || activeLayers.size > 0
                ) return;
                const next = approvalQueue.shift();
                if (!next || !input || !composerRow) return;
                activeApproval = next;
                savedDraft = input.value;
                input.value = "";
                if (approvalDetail) approvalDetail.remove();
                const prompt = renderApprovalPrompt(next, decideApproval);
                approvalDetail = prompt.detail;
                approvalToggle = prompt.toggle;
                panel.append(approvalDetail);
                composerEl.dataset.state = "approval";
                composerEl.dataset.approvalId = next.id;
                composerEl.replaceChildren(prompt.root);
                paintButtons();
              };
            note: |
              审批只在 composer 为 normal 且没有更高浮层时取队首，并先保存当前草稿再替换子树。这个门条件保证插件模态打开时不会偷偷推进安全决策。
          - snippet: |
              approvalQueue = approvalQueue.filter((item) => item.id !== active.id);
              activeApproval = null;
              approvalDetail?.remove();
              approvalDetail = null;
              approvalToggle = null;
              composerEl.dataset.state = "decided";
              delete composerEl.dataset.approvalId;
              const decided = document.createElement("div");
              decided.className = "agent-approval-decided";
              decided.textContent = outcome.decision === "allow" ? "✓ 已批准，Agent 继续执行" : "✕ 已拒绝，Agent 可继续对话";
              composerEl.replaceChildren(decided);
              paintButtons();
              if (decideTimer) clearTimeout(decideTimer);
              decideTimer = setTimeout(() => {
                decideTimer = null;
                restoreComposer();
                presentNextApproval();
              }, 400);
            note: |
              决策后先从队列移除当前请求，再进入 decided 短态；延时结束后恢复草稿并立即展示下一条审批，保证多请求逐个处理而不会并发接管输入区。
      - path: src/plugins/app-agent/render.ts
        note: 无状态 DOM 渲染件：过程组折叠、决策行和审批摘要/详情。
        changes:
          - snippet: |
              settle(label: string, durationMs: number): void {
                text.textContent = label;
                time.textContent = `${(durationMs / 1000).toFixed(1)}s`;
                root.classList.remove("running");
                root.classList.add("done");
                if (!root.contains(document.activeElement)) root.classList.remove("open");
              },
            note: |
              过程组 settle 时写入结果与耗时，并在焦点不在组内时自动收起；用户正在展开检查结果时不会被强行合上。
          - snippet: |
              const detail = renderApprovalDetail(req);
              const toggle = document.createElement("button");
              toggle.type = "button";
              toggle.className = "agent-detail-toggle";
              toggle.dataset.detailToggle = "";
              toggle.setAttribute("aria-expanded", "false");
              toggle.textContent = "查看详情 ▾";
              toggle.addEventListener("click", () => {
                const open = detail.classList.toggle("open");
                toggle.setAttribute("aria-expanded", String(open));
              });
            note: |
              审批摘要与详情分离：详情浮层由同一个 toggle 控制展开并同步 aria-expanded，主视图保持一行摘要，需要审计时再展开。
      - path: src/ui/active-layer.ts
        note: 窗口级浮层栈，决定 Escape 与审批承接顺序。
        changes:
          - snippet: |
              escape(layer: object): boolean {
                const entry = this.#layers.at(-1);
                if (!entry || entry.layer !== layer) return false;
                this.#layers.pop();
                this.#notify();
                entry.surface.close();
                return true;
              }
            note: |
              只有栈顶浮层才能消费 Escape；它关闭后通知订阅者恢复被挡住的审批。这个集中所有权避免了两个 document 监听器同时解释一次按键。
  - group: 视觉与测试支撑
    attention: skim
    why: 样式和回归测试支撑交互，但不改变状态机协议。
    files:
      - path: src/styles.css
        note: 过程组、审批台、浮层、toast 与宽窄 composer 的视觉规则。
      - path: src/ui/icons.ts
        note: 左右面板开关 inline SVG。
      - path: tests/app-agent.test.ts
        note: 过程折叠、审批排队、草稿恢复、中断清理和运行中排队。
      - path: tests/app-agent-render.test.ts
        note: 无状态渲染结构、详情浮层与决策行。
      - path: tests/active-layer.test.ts
        note: 浮层层序和 Escape 所有权。
reviewGuide:
  order:
    - 先读 `app-agent/index.ts` 的 `handleEvent`：确认 turn-start/tool-start/tool-end/turn-end/aborted/error 的收组顺序。
    - 再读 `presentNextApproval`、`decideApproval`、`restoreComposer`：确认草稿、队列和 decided 短态的先后。
    - 接着读 `render.ts`：过程组只在焦点不在组内时自动收起，审批详情与摘要分居两个节点。
    - 然后读 `active-layer.ts`：一次 Escape 只能由栈顶消费，审批不能穿透模态。
    - 最后抽查测试：Stop 后审批必须清空，排队审批必须逐个恢复草稿。
  risks:
    - 如果 aborted 清尾顺序被改坏，后端已取消的审批会继续停在 composer，用户点击后得到 no-op，却看到“已批准/已拒绝”的假反馈。
    - 如果 Agent 快捷键绕过 ActiveLayerStack，插件模态与审批会争用同一次 Escape，可能把“关闭设置”误记成拒绝写入。
    - 历史 JSONL 没有工具结果内容；若未来渲染器假定结果存在，旧会话会显示空白或伪造内容。
  acceptance:
    - item: 回合过程组运行中显示当前动作，结束后自动折叠为摘要
      evidence: tests/app-agent.test.ts 与 tests/app-agent-render.test.ts
    - item: 审批接管 composer，支持详情、批准/拒绝、排队与草稿恢复
      evidence: tests/app-agent.test.ts
    - item: Stop、中断与错误不会留下悬空审批
      evidence: tests/app-agent.test.ts（aborted 单审批与排队审批）
    - item: 浮层打开时 Agent 快捷键让路
      evidence: tests/active-layer.test.ts 与 tests/app-agent.test.ts
