reviewGuide:
  order:
    - src-tauri/src/llm_stream.rs
    - src/host/llm-stream.ts
    - src/host/llm.ts
    - src/host/slots.ts
    - src/plugins/app-chat/index.ts
    - tests/host-llm-stream.test.ts
  risks:
    - 每 invoke 的 IPC Channel 必须绑定同一窗口和句柄；迟到 chunk 或 send 失败需要关闭流，不能串到其他窗口。
    - 只有带 finish_reason 的完整回答可进入历史；错误或停止产生的半截正文留在界面，不能污染下一轮上下文。
    - 外置插件只能消费收窄后的 llm 与 workspace 面；扩大白名单会破坏 `src/plugins/` 不触达 Tauri 的分层纪律。
  acceptance:
    - item: 外置插件经宿主服务推理、渲染 chat 并读取上下文，不触达 @tauri-apps/*
      evidence: tests/guard.test.ts 与 pnpm verify:layering
    - item: 流式回答、停止、失败重试与能力错误可见
      evidence: tests/app-chat.test.ts 与 tests/host-llm-stream.test.ts
    - item: 粘贴或拖入 image/audio 组成多模态请求，路径与 inline 边界明确
      evidence: tests/app-chat.test.ts
    - item: verify:layering、verify:env-independence、verify:dep-audit 绿
      evidence: 本仓门禁套件
