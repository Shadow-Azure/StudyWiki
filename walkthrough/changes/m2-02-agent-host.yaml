feature: |
  内置与外置插件可以在右栏发起流式对话，逐步看到回答与 reasoning，能停止或重试；用户可粘贴或拖入图片、音频组合进多模态请求，超限或模型能力不足会得到明确错误。
userFlow:
  - 打开右栏 chat，选择支持所需能力的模型。
  - 发送消息，逐块查看正文和 reasoning。
  - 需要时停止生成；失败请求可重试。
  - 粘贴或拖入图片、音频，与文本组成多模态消息；能力不足时收到明确错误。
architectural: |
  推理仍从 Rust 唯一联网出口发出；流式 chunk 经每次 invoke 独立的 IPC Channel 隔离到窗口，宿主 `llm-stream` 负责唯一 chunk 到消息快照的组装。外置插件只能经 guard 收窄的 `chatStream`/workspace 服务面访问宿主能力，不能直接触达 Tauri。右栏 UI 后续由基础 agent 的 `app-agent` 接管，本 PR 立起的是宿主缝。
