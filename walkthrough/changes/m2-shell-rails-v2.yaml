title: #53 主窗口 Activity Rail 与可折叠侧栏
scale:
  files: 17
  additions: 1418
  deletions: 199
feature: |
  主窗口现在固定显示 54px 的 Activity Rail，文件栏和 Agent 栏成为两个可独立拖拽、隐藏和恢复的侧栏；宽度与开合状态在本机保存。历史插件的 `topbar.left` 注册仍会自动落到 Activity Rail，macOS 主窗与动态窗则把应用内开关和系统窗口按钮放在同一层。

  ![双窗口布局同步](../assets/m2-shell-rails-v2/two-window-layout.svg)

  *图 1：多个窗口共享本机布局偏好，拖拽中的窗口先暂停接收外部更新。*
userFlow:
  - 用户从标题栏左侧开关打开或关闭文件栏 → shell 立即重排四列 → Activity Rail 保持固定，阅读区获得释放空间。
  - 用户拖动文件栏或 Agent 栏的 12px 命中区 → Pointer Capture 持续接收移动 → 蓝线与竖向 pill 跟随，松手后保存宽度。
  - 用户双击拖拽条或多按 Home/End → 侧栏回到默认宽度或当前允许的边界 → 阅读区始终至少保留 340px。
  - 用户使用 Cmd/Ctrl+B 或加 Option/Alt 的快捷键 → 分别切换文件栏与 Agent 栏 → 开关状态和 aria-pressed 同步。
  - 用户重启应用 → 从 `studywiki.shell-layout.v1` 读取宽度与开合状态 → 两栏恢复到上次形状。
  - 本地存储损坏或版本不匹配 → 只回退对应字段或整套默认值 → 应用继续启动，不因 UI 偏好阻断使用。
architectural: |
  shell 从三栏改为 `Activity Rail | 文件栏 | 阅读区 | Agent 栏`。固定 Activity Rail 承载 `activity.left`，文件树、阅读器和 Agent 仍使用既有槽位；`app-shell` 负责四列 DOM、拖拽与持久化，`app-windows` 等命令插件只注册渲染，不再决定自己所在的位置。

  沿图 2：标题栏开关决定两栏可见性；Activity Rail 固定占 54px；文件栏、阅读区和 Agent 栏在剩余宽度内分配空间。旧插件注册 `topbar.left` 时，`SlotsService` 在入口归一成 `activity.left`，因此 API v1 插件无需重编译。

  语义变化在布局所有权：宽度和开合状态成为 shell 的本机偏好，隐藏栏只把渲染宽度降为 0，子树仍保持挂载，Agent 会话与运行状态不会因收起而销毁。macOS overlay 与最小窗口尺寸同时应用到主窗和动态窗，避免两套建窗路径分叉。
