codeMap:
  - group: 四列壳与布局状态
    attention: must-read
    why: 几何约束、Pointer Capture 与跨窗同步决定侧栏是否会挤坏阅读区或丢状态。
    files:
      - path: src/plugins/app-shell/layout.ts
        note: 纯函数布局模型：尺寸常量、视口约束、版本化状态和 localStorage 容错。
        changes:
          - snippet: |
              export function maxRailWidth(side: RailSide, viewport: number, otherOpenWidth: number): number {
                const limits = RAIL_LIMITS[side];
                const available = Math.floor(viewport - ACTIVITY_WIDTH - otherOpenWidth - MAIN_MIN);
                return Math.max(limits.min, Math.min(limits.max, available));
              }
            note: |
              侧栏最大宽度先扣除固定 Activity Rail、另一侧栏和阅读区最小宽度；返回值仍不低于本栏最小值，保证极端窄窗口也有确定结果。
          - snippet: |
              export function normalizeShellLayout(value: unknown, _viewport = window.innerWidth): ShellLayoutState {
                const fallback = defaultShellLayout();
                if (typeof value !== "object" || value === null) return fallback;
                const input = value as Record<string, Record<string, unknown>>;
                if ((input as Record<string, unknown>).version !== 1) return fallback;
                const rail = (side: RailSide): RailLayout => ({
                  width: clampAbsolute(side, input[side]?.width),
                  open: typeof input[side]?.open === "boolean" ? input[side].open as boolean : true,
                });
                return { version: 1, files: rail("files"), agent: rail("agent") };
              }
            note: |
              持久化输入是不可信边界：版本不符整套回退，单栏宽度与布尔值则逐字段归一。绝对几何在这里只做粗约束，真实视口约束由 shell 绘制时再应用。
      - path: src/plugins/app-shell/index.ts
        note: 四列 DOM 与交互：槽位挂载、拖拽手势、键盘、跨窗 storage 和清理。
        changes:
          - snippet: |
              const constrainState = (): void => {
                if (state.files.open) {
                  state.files.width = clampRailWidth(
                    "files", state.files.width, window.innerWidth,
                    state.agent.open ? state.agent.width : 0,
                  );
                }
                if (state.agent.open) {
                  state.agent.width = clampRailWidth(
                    "agent", state.agent.width, window.innerWidth,
                    state.files.open ? state.files.width : 0,
                  );
                }
              };
            note: |
              每次绘制前都按当前窗口重新约束两栏；关闭栏不参与宽度扣除，打开时自动给阅读区让路，避免窗口缩小后保留失效几何。
          - snippet: |
              const onStorage = (event: StorageEvent): void => {
                if (event.key !== SHELL_LAYOUT_KEY || isDragging()) return;
                state = loadShellLayout();
                paint();
              };
            note: |
              跨窗更新只处理布局键；正在拖拽的窗口先忽略，避免另一个窗口的写入打断本地手势。松手后的正常持久化会让最后写入值成为共识。
          - snippet: |
              const stop = (event: PointerEvent): void => {
                if (!active || event.pointerId !== pointerId) return;
                const hasPendingFrame = frame !== null;
                cancelGesture(event, false);
                // A settle flushes the last coalesced position even if pointerup arrives
                // before the browser runs the scheduled animation frame.
                if (hasPendingFrame) write();
                setWidth(side, state[side].width);
              };
            note: |
              pointerup 先结束捕获与拖拽标记，再主动 flush 尚未执行的 rAF，确保最后一次移动不会因合帧丢失；setWidth 在此时完成持久化。
      - path: src/host/slots.ts
        note: 槽位别名与注册归一，保护外置 v1 插件。
        changes:
          - snippet: |
              const SLOT_ALIASES = new Map<string, SlotName>([["topbar.left", "activity.left"]]);

              /** Normalize an API v1 registration to its current slot; unknown preview slot
               * names pass through unchanged.
               * @param slot Declared registration slot, including the API v1 alias.
               * @returns Current slot name for known registrations; otherwise the input. */
              export function normalizeSlotRegistration<T extends string>(
                slot: T,
              ): T extends SlotRegistration ? SlotName : T {
                return (SLOT_ALIASES.get(slot) ?? slot) as T extends SlotRegistration ? SlotName : T;
              }
            note: |
              旧插件的 `topbar.left` 在注册入口归一成 `activity.left`，挂载只认当前槽位；兼容发生在服务边界，旧插件渲染函数不改。
      - path: src-tauri/src/windows.rs
        note: 动态窗复用最小尺寸与 macOS overlay 设置。
        changes:
          - snippet: |
              let builder = WebviewWindowBuilder::new(&app, &label, WebviewUrl::default())
                  .title("StudyWiki")
                  .inner_size(1180.0, 760.0)
                  .min_inner_size(920.0, 480.0);

              // Shadowing keeps the macOS-only builder methods out of other platforms,
              // so cross-platform clippy does not see an unused mutable builder.
              #[cfg(target_os = "macos")]
              let builder = builder
                  .title_bar_style(tauri::TitleBarStyle::Overlay)
                  .hidden_title(true)
                  .traffic_light_position(tauri::LogicalPosition::new(12.0, 12.0));
            note: |
              动态窗与主窗共用最小内尺寸，平台条件编译只在 macOS 叠加 overlay 与红绿灯位置，其他平台不会看到未使用的 builder 方法。
