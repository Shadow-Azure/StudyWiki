reviewGuide:
  order:
    - 先读 `app-shell/layout.ts`：确认绝对边界与视口约束是两层，不是一套 mix。
    - 再读 `app-shell/index.ts` 的 `constrainState`、`connectHandle` 和 `onStorage`：检查拖拽、rAF 与持久化的时序。
    - 接着读 `host/slots.ts`：旧槽位只在注册入口归一，mount 不接受历史键。
    - 然后读 `windows.rs` 与 `tauri.conf.json`：主窗和动态窗的最小尺寸、overlay 必须一致。
    - 最后抽查 `tests/app-shell.test.ts` 的取消、双击重置和双窗口同步。
  risks:
    - 如果 pointerup 没有 flush pending rAF，最后一次拖动会丢失，表现为松手回弹到旧宽度。
    - 如果跨窗 storage 在拖拽中仍然重绘，另一个窗口会抢走本地手势，用户看到手柄跳动。
    - 如果 `topbar.left` 被从 mount 层临时放行，会重新出现别名与当前槽位两套入口，外置插件行为难以预测。
  acceptance:
    - item: 固定 Activity Rail、文件栏与 Agent 栏独立拖拽/隐藏
      evidence: tests/app-shell.test.ts
    - item: 宽度与开合状态持久化，损坏输入回退默认
      evidence: tests/app-shell-layout.test.ts 与 tests/app-shell.test.ts
    - item: 快捷键、Home/End 和双击重置可用
      evidence: tests/app-shell.test.ts
    - item: 旧 `topbar.left` 插件仍进入 Activity Rail
      evidence: tests/host-workspace-slots.test.ts 与 tests/ui-preview.test.ts
    - item: macOS overlay 与动态窗最小尺寸一致
      evidence: src-tauri/tauri.conf.json、src-tauri/src/windows.rs；PR #54 人工打包冒烟
