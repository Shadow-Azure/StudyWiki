design: |
  ### 问题与约束
  - 原有三栏把全局命令、品牌和文件标题挤在顶栏；右侧 Agent 栏没有同规格拖拽条，隐藏后也没有可发现的恢复入口。
  - 必须保留外置插件 API v1 的 `topbar.left`，并维持阅读区最小宽度、Agent 子树挂载和现有槽位契约。
  - 发布产物不引入 UI 框架；布局偏好是本机 UI 状态，不进入 `settings.json` 或学习库。

  ### 候选方案
  - 保留三栏，只加粗拖拽命中区：改动最小，但全局命令仍与阅读标题争夺顶栏。
  - 隐藏侧栏后保留 56px 图标轨：恢复更近，但压缩阅读区，且与用户确认的完全隐藏交互不一致。
  - 固定 Activity Rail + 两侧栏完全折叠：全局命令获得稳定归属，阅读区可回收完整侧栏宽度，代价是标题栏开关和 layout 状态机更复杂。

  ### 选型与理由
  选择固定 Activity Rail 与两个完全折叠的侧栏。`layout.ts` 只负责几何与持久化纯函数，`index.ts` 只负责 DOM、Pointer Capture、键盘与 storage 事件；边界先在绝对尺寸内归一，再按当前视口扣除另一栏和阅读区最小宽度。

  ### 关键权衡与边界
  - `localStorage` 采用最后写入者获胜，不提供跨窗口冲突合并；正在拖拽的窗口忽略 storage 事件，松手后再恢复同步。
  - 非 macOS 仍保留系统标题栏，只让 macOS 的 application titlebar 使用 overlay；三端完全自绘窗口留作后续议题。
  - Activity Rail 当前只承载命令图标，不引入视图切换；外置 v1 插件仍通过别名进入同一空间。

  ### 落地映射：功能点 → 变更文件
  #### 拖拽与持久化链路

  沿图「拖拽与持久化链路」：用户按下拖拽条后 shell 记录起点并捕获指针，移动只更新 pending x，由 rAF 写回布局；松手时先 flush 最后一帧，再做一次持久化。布局读取经过归一化，坏数据只让对应字段回退。

  ```text
  src/plugins/app-shell/
    ├─ layout.ts  几何边界、版本化状态、localStorage 读写与坏数据归一
    └─ index.ts   四列 DOM、槽位挂载、Pointer Capture、键盘、storage 与清理
  src/host/slots.ts           API v1 槽位别名归一，统一挂到 Activity Rail
  src/plugins/app-windows/    新窗口命令迁入 Activity Rail
  src/plugins/plugin-manager/ 插件管理命令迁入 Activity Rail
  src/plugins/llm-settings/   模型设置命令迁入 Activity Rail
  src-tauri/
    ├─ tauri.conf.json       主窗最小尺寸与 macOS overlay 配置
    └─ src/windows.rs        动态窗使用同一最小尺寸和 overlay
  tests/
    ├─ app-shell-layout.test.ts 纯几何、归一化与持久化边界
    ├─ app-shell.test.ts        拖拽、折叠、快捷键与跨窗同步
    └─ host-workspace-slots.test.ts 旧槽位别名
  ```
