kind: change
issue: m1-02-reading-polish
title: #44 阅读体验统一
scale:
  files: 42
  additions: 1653
  deletions: 180
feature: |
  Markdown、Excel 和视频在同一窗口内有一致的打开、切换、加载、错误、标题与保存体验。未打开文档和已开库未选文档有空态；脏文档切换或换库必须确认；视频支持空格暂停和左右方向键快退快进。
userFlow:
  - 切换文件或换库时有未保存修改，先弹确认框，取消则停留原文件。
  - 未打开文档与已开库未选文档时，主区显示统一空态。
  - 按 Mod-S 保存 markdown 或 excel；视频按空格暂停、左右方向键快退快进五秒。
  - 加载中显示统一加载条，失败显示统一错误条，窗口标题跟随活动文档。
architectural: |
  切换守卫上收到 `WorkspaceService`，查看器只自证是否脏并提供确认闭包；`openFile` 与 `setRoot` 返回异步布尔，任一守卫拒绝即保持原状态。外置插件只能访问窄化的 workspace facade，不能编程换根或建窗。
codeMap:
  - group: 守卫与共享查看器
    attention: must-read
    why: 守卫状态机与统一查看器套件是本期全部新语义。
    files:
      - path: src/host/workspace.ts
        note: 维护 root、activeFile、事件流、切换守卫和插件 facade。
      - path: src/host/windows.ts
        note: 换根、切文件与关窗先聚合并发守卫，再决定变更或销毁。
      - path: src/ui/viewer.ts
        note: 统一错误条、加载态、窗口标题规则和 Mod-S 键位。
      - path: src/loader/guard.ts
        note: 外置插件 workspace 与 windows 服务面收窄。
  - group: 查看器接入
    attention: skim
    why: 三格式查看器接入共享套件与代际防竞态。
    files:
      - path: src/plugins/doc-markdown/index.ts
        note: 单调 open sequence 拒绝迟到读取，保存捕获快照。
      - path: src/plugins/doc-excel/index.ts
        note: 错误与加载互斥，保留 sequence 防竞态。
      - path: src/plugins/doc-video/index.ts
        note: Space 与左右方向键，迟到错误按渲染代际丢弃。
      - path: src/plugins/app-shell/index.ts
        note: 窗口标题基线，文档插件自持时覆盖。
      - path: src/plugins/app-windows/index.ts
        note: 多窗口与守卫路径接线。
      - path: src/bootstrap.ts
        note: workspace controller 与 windows 服务绑定。
  - group: 测试
    attention: skim
    why: 守卫、竞态与键位行为由测试钉住。
    files:
      - path: tests/guard.test.ts
        note: 切换守卫拒绝与放行。
      - path: tests/ui-viewer.test.ts
        note: 共享错误条、加载态与标题规则。
      - path: tests/doc-markdown-edit.test.ts
        note: 保存代际与脏状态。
      - path: tests/doc-video.test.ts
        note: 播放键与迟到错误。
      - path: tests/host-services.test.ts
        note: workspace 与 windows 服务组合。
  - group: 机械伴生
    attention: skip
    why: null
    files:
      - path: docs/commands.md
        note: 命令目录生成区。
      - path: docs/architecture.i18n.yaml
        note: 配对记录，代表全部 i18n 伴生文件。
reviewGuide:
  order:
    - src/host/workspace.ts
    - src/host/windows.ts
    - src/ui/viewer.ts
    - src/plugins/doc-markdown/index.ts
    - tests/guard.test.ts
  risks:
    - 真实 Tauri 下 CloseRequested 处理期间原生 confirm 不显示，守卫确认改走应用内自绘对话框。
    - openFile 与 setRoot 改异步布尔，调用方忽略返回值会产生时序竞态。
  acceptance:
    - item: 三格式切换一致且空态明确
      evidence: tests/ui-viewer.test.ts 与 tests/app-shell.test.ts
    - item: 脏文档切换与换库被守卫拦下
      evidence: tests/guard.test.ts 与 tests/host-services.test.ts
    - item: Mod-S、视频 Space 与方向键可用
      evidence: tests/doc-markdown-edit.test.ts 与 tests/doc-video.test.ts
    - item: pnpm test、build、verify:layering、verify:env-independence 绿
      evidence: 本仓门禁套件
verification:
