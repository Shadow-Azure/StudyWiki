          - snippet: |
              fn build_multipart_head(fields: &[(&str, &str)], file_name: &str) -> (Vec<u8>, &'static str) {
                  let mut out = Vec::new();
                  // 文件名进 header：转义引号与换行，杜绝 multipart 头注入。
                  let file_name: String = file_name
                      .chars()
                      .map(|c| {
                          if c == '"' || c == '\r' || c == '\n' {
                              '_'
                          } else {
                              c
                          }
                      })
                      .collect();
                  for (name, value) in fields {
                      out.extend_from_slice(
                          format!(
                              "--{MULTIPART_BOUNDARY}\r\nContent-Disposition: form-data; name=\"{name}\"\r\n\r\n{value}\r\n"
                          )
                          .as_bytes(),
                      );
            note: |
                multipart 头拼接前转义文件名引号与换行，body 用 head+文件流+tail。
          - snippet: |
              fn transcribe_checked(
                  agent: &ureq::Agent,
                  ep: &Endpoint,
                  req: &TranscribeRequest,
                  root_check: &dyn Fn(&str) -> bool,
              ) -> Result<TranscriptionResult, LlmError> {
                  if ep.kind != "asr" {
                      return Err(LlmError::new(
                          "INVALID_CONFIG",
                          "转录只接受 kind=asr 的 endpoint",
                      ));
                  }
                  if !root_check(&req.path) {
                      return Err(LlmError::new(
                          "UNAUTHORIZED_PATH",
                          format!("转录文件不在库根内：{}", req.path),
                      ));
                  }
                  match ep.protocol.as_deref() {
                      Some("chat") => run_transcribe_chat(agent, ep, req),
            note: |
                transcribe_checked 先拒非 asr 与库根外路径，再按 protocol 分叉。
          - snippet: |
              fn run_transcribe(
                  agent: &ureq::Agent,
                  ep: &Endpoint,
                  req: &TranscribeRequest,
                  _root_check: &dyn Fn(&str) -> bool,
              ) -> Result<TranscriptionResult, LlmError> {
                  let file = std::fs::File::open(&req.path)
                      .map_err(|e| LlmError::new("UNSUPPORTED_CONTENT", format!("转录文件读取失败：{e}")))?;
                  let file_len = file.metadata().map(|m| m.len()).unwrap_or(0);
                  let file_name = std::path::Path::new(&req.path)
                      .file_name()
                      .map(|n| n.to_string_lossy().to_string())
                      .unwrap_or_else(|| "audio.bin".into());
                  let mut fields: Vec<(&str, &str)> = vec![
                      ("model", req.model.as_str()),
                      ("response_format", "verbose_json"),
                      ("timestamp_granularities[]", "segment"),
                  ];
                  if let Some(language) = &req.language {
                      fields.push(("language", language.as_str()));
            note: |
                transcriptions 路流式发送原文件，并请求 verbose_json + segment 粒度。
          - snippet: |
              #[tauri::command]
              pub async fn llm_transcribe(
                  app: AppHandle,
                  reg: tauri::State<'_, Mutex<crate::windows::WindowRegistry>>,
                  req: TranscribeRequest,
              ) -> Result<TranscriptionResult, LlmError> {
                  let roots_ok = {
                      let reg = reg.lock().unwrap();
                      reg.roots()
                          .iter()
                          .map(|p| p.to_string_lossy().to_string())
                          .collect::<Vec<_>>()
                  };
                  tauri::async_runtime::spawn_blocking(move || {
                      let dir =
                          config::app_studywiki_dir(&app).map_err(|e| LlmError::new("INVALID_CONFIG", e))?;
                      let s = config::load_settings(&dir).map_err(|e| LlmError::new("INVALID_CONFIG", e))?;
                      let ep = find_endpoint(&s, &req.endpoint_id)?;
                      let root_check = |p: &str| crate::windows::path_under_roots(&roots_ok, p);
                      transcribe_checked(&transcribe_agent(), &ep, &req, &root_check)
            note: |
                llm_transcribe 用 spawn_blocking 执行 30 分钟级传输，避免冻结主线程。
      - path: src/host/llm.ts
        note: 宿主路由：展示目标与上传绑定。
        changes:
          - snippet: |
              export interface TranscriptionSegment {
                /** Segment start in seconds. */
                start: number;
                /** Segment end in seconds. */
                end: number;
                /** Segment text. */
                text: string;
              }

              /** Unified transcription result: an empty segments array means the server returned no timestamps. */
              export interface TranscriptionResult {
                /** Full transcript text. */
                text: string;
                /** Timestamped segments, possibly empty. */
                segments: TranscriptionSegment[];
              }

              /** Resolved ASR destination shown in the approval card and bound to the upload. */
              export interface AsrTarget {
                /** Endpoint id sent to Rust. */
                endpointId: string;
                /** Human-facing endpoint name for the approval card. */
                endpointName: string;
                /** Model id sent as the upstream `model` field. */
                model: string;
                /** Wire protocol that Rust will use. */
                protocol: "transcriptions" | "chat";
              }
            note: |
                TranscriptionResult 与 AsrTarget 是宿主/工具共享契约。
          - snippet: |
                async #routeAsr(model?: string): Promise<AsrTarget> {
                  const settings = await this.listEndpoints();
                  const asr = settings.endpoints.filter((e) => e.kind === "asr" && e.models.length > 0);
                  const project = (e: RedactedEndpoint, modelId: string): AsrTarget => ({
                    endpointId: e.id,
                    endpointName: e.name,
                    model: modelId,
                    protocol: e.protocol === "chat" ? "chat" : "transcriptions",
                  });
                  if (model) {
                    const owners = asr.filter((e) => e.models.some((m) => m.id === model));
                    if (owners.length === 0) throw new LlmError("MODEL_UNKNOWN", `未找到 ASR 模型：${model}`);
                    if (owners.length > 1) {
                      throw new LlmError("MODEL_AMBIGUOUS", `模型 ${model} 同时属于 ${owners.map((e) => e.id).join(", ")}`);
                    }
                    return project(owners[0]!, model);
                  }
                  const candidates = asr.flatMap((e) => e.models.map((m) => project(e, m.id)));
                  if (candidates.length === 0) throw new LlmError("MODEL_UNKNOWN", "未配置 ASR endpoint");
                  if (candidates.length > 1) {
                    throw new LlmError("MODEL_AMBIGUOUS", `存在多个 ASR 模型，请指定 model：${candidates.map((c) => c.model).join(", ")}`);
                  }
                  return candidates[0]!;
                }

                /** 非流式 chat：按 model 解析归属 endpoint，tools 能力门禁在本层后交 Rust 传输。
                 * @throws LlmError MODEL_UNSPECIFIED（无 model 且无默认）/ MODEL_UNKNOWN（无归属）/ MODEL_AMBIGUOUS（多归属）/
            note: |
                #routeAsr 只筛 kind=asr，投影 endpoint 名称、模型与协议。
          - snippet: |
                resolveAsrTarget(model?: string): Promise<AsrTarget> {
                  return this.#routeAsr(model);
                }

                /** 转录库根内音视频：使用已解析并展示给用户的 target，Rust 按 protocol 分叉执行。
                 * @throws LlmError 目标 endpoint/模型在审批后消失时报 MODEL_UNKNOWN；传输词表原样透传。 */
                async transcribe(req: {
                  path: string;
                  language?: string;
                  target: AsrTarget;
                }): Promise<TranscriptionResult> {
                  const settings = await this.listEndpoints();
                  const endpoint = settings.endpoints.find((e) => e.id === req.target.endpointId);
                  if (!endpoint || endpoint.kind !== "asr" ||
                      !endpoint.models.some((m) => m.id === req.target.model)) {
                    throw new LlmError(
                      "MODEL_UNKNOWN",
                      `ASR endpoint 或模型已变更：${req.target.endpointId}/${req.target.model}`,
                    );
                  }
                  return this.#call<TranscriptionResult>("llm_transcribe", {
                    req: {
                      endpointId: req.target.endpointId,
                      model: req.target.model,
                      path: req.path,
                      ...(req.language ? { language: req.language } : {}),
            note: |
                resolveAsrTarget 只做本地路由；transcribe 校验 target 仍存在后才发命令。
