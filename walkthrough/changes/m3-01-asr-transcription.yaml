design: |
  ### 双协议统一结果

  Rust 对两条 wire 都返回 TranscriptionResult：text 是全文，segments 是可选的时间戳段。transcriptions 路把 verbose_json 的 segments 原样带出；chat 路回的是纯文本，segments 固定为空，由前端按确定性规则解析。

  ### 动态挂载与一次审批

  宿主每回合先问 hasAsrCapability：没有带模型的 kind=asr endpoint 就不把 transcribe 放进工具声明，模型无法选择它。有 ASR 时，工具先做扩展名与库根预检，再用文件大小生成审批卡；一次批准同时覆盖上传与产物落盘，拒绝时不会发出任何网络请求。

  ### 确定性产物格式化

  segments 非空时逐段写 [HH:MM:SS] 文本；segments 为空时，只有匹配行 ≥3 且覆盖 ≥80% 才采信聊天口文本，否则整体降级 timestamps: none。落点固定为 .study-wiki/raw/<源去扩展名>/transcript.md，模型只收到段数摘要。
