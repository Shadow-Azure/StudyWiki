reviewGuide:
  order:
    - src-tauri/src/llm.rs
    - src/plugins/agent-core/tools.ts
    - src/plugins/agent-core/transcribe.ts
    - src/host/llm.ts
    - src/plugins/llm-settings/index.ts
  risks:
    - transcribe 的审批必须发生在任何网络请求之前；如果以后把探测大小改成远程调用或在审批前读文件，隐私边界会被破坏。
    - 聊天口的时间戳是模型输出，不是协议契约；80% 规则只能降低误判，不能保证语义正确，重要结论仍应回看原文。
    - 审批卡展示的 endpoint/模型会绑定到实际上传；批准后若该 endpoint 或模型被删改，transcribe 报 MODEL_UNKNOWN，不会悄悄换目标。
    - 多条 asr endpoint 且未指定 model 会报 MODEL_AMBIGUOUS，不会自动选第一条；设置面板应引导用户给模型命名。
  acceptance:
    - item: 配置 asr endpoint 后 agent 能转录库内音视频，产物含 [HH:MM:SS] 段
      evidence: tests/agent-tools.test.ts 与 tests/host-llm.test.ts
    - item: 无 asr 配置时工具不挂载，会话中途删除配置不崩溃
      evidence: tests/agent-service.test.ts 与 tests/agent-tools.test.ts
    - item: transcriptions 与 chat 两种协议分别发送 multipart / input_audio
      evidence: src-tauri/src/llm.rs 单测
    - item: Rust/TS 全量测试、分层、环境无关性与文档门禁绿
      evidence: pnpm test、cargo test、verify:layering、verify:env-independence、verify:docs
