feature: |
  用户在 agent 面板说“帮我把这个视频转录成文字”。agent 调用 transcribe 工具；工具先检查扩展名与库根、解析目标 endpoint，再弹出审批卡，写明文件、大小、endpoint 名称与模型、产物路径。

  批准后，Rust 按 endpoint 的 protocol 选择 multipart 转录口或聊天口 input_audio，把请求发给用户配置的 ASR endpoint；返回的文本由前端代码确定性格式化，写到 .study-wiki/raw/<源>/transcript.md。模型只收到“已生成、共 N 段”的摘要，需要细节时再用 read/grep 回查。

  ![ASR 转录数据流](../assets/m3-01-asr-transcription/asr-flow.svg)

  *图 1：从用户请求到 transcript.md 的完整链路；Rust 只负责传输，时间戳由代码生成。*
userFlow:
  - 用户打开带视频的库，在 agent 面板输入“把这个视频转录成文字”。
  - agent 选择 transcribe；工具确认文件在库根内且扩展名可转录，并读取文件大小。
  - composer 接管为审批卡：显示路径、大小、产物位置，并说明文件会上传到所选 ASR endpoint。
  - 用户批准后，Rust 按 endpoint.protocol 上传；transcriptions 路原样传视频容器，chat 路只收 wav/mp3 并编码为 data URL。
  - 前端把 segments 或逐行时间戳格式化并写入 .study-wiki/raw/<源>/transcript.md，模型收到段数摘要。
  - 用户继续问“第 15 分钟讲了什么”，agent 用 read/grep 读取 transcript.md 回查。
architectural: |
  配置层给 endpoint 增可选 protocol；宿主 LlmService 只做 asr 路由；agent-core 每回合按 hasAsrCapability 决定是否挂 transcribe；Rust 是唯一联网点，按 protocol 分叉 multipart 与 input_audio。聊天路由继续只认 kind=chat，转录只认 kind=asr，两种 wire 形状不在路由层混用。

  沿图 1：用户请求进入 agent 工具，审批后才到 Rust；Rust 持有 key 并选择 wire 形状；endpoint 返回后，格式化与落盘回到 TS，模型看不到原始全文。

  结构变化是新增一条 transcribe 通道和一个 protocol 字段；语义变化是无 ASR 配置时工具不进入声明清单，agent 行为与 m2 一致；配置删除后下一回合自动收回，历史 wire 调用返回明确错误。
