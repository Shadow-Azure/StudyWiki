        note: 命令目录生成区。
      - path: docs/architecture.i18n.yaml
        note: 双语配对记录。
reviewGuide:
  order:
    - src-tauri/src/config.rs
    - src-tauri/src/llm.rs
    - src/host/llm.ts
    - src/plugins/llm-settings/index.ts
    - tests/host-llm.test.ts
  risks:
    - key 保存在用户 home 的明文 settings.json，仅靠 0600 和脱敏展示降低暴露；产品不得内置或复制密钥。
    - 远程 HTTP 是登记过的环境无关豁免，新增出口必须继续经 Rust 薄能力层，不能移进前端或外置插件。
    - 探测 `GET /models` 只能证明协议可达，不完全等价于某个模型可完成 chat、vision、audio 或 tools 请求。
  acceptance:
    - item: chat 与 ASR endpoint 可配置、可探测，错误语义明确
      evidence: tests/host-llm.test.ts 与 tests/llm-settings.test.ts
    - item: 产品不内置密钥，list 投影脱敏
      evidence: src-tauri/src/config.rs 与 src-tauri/src/llm.rs
    - item: 环境豁免与 ADR 登记完成
      evidence: docs/environment-independence.md 与 .agents/notes/proposed/architecture/2026-09-19-ai-inference-supply.md
    - item: verify:env-independence、verify:dep-audit、verify:layering 绿
      evidence: 本仓门禁套件
