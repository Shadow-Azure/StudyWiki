reviewGuide:
  order:
    - src-tauri/src/native_close.rs
    - src-tauri/src/windows.rs
    - src/host/windows.ts
    - src/bootstrap.ts
    - tests/host-services.test.ts
  risks:
    - `_close:` 是 macOS 26 实测必需的私有 selector；系统行为变化时只能跳过该路钩子，不能让启动失败。
    - 守卫武装必须幂等；重复读取红点 target/action 可能把桥接动作误存为原始动作并破坏后续关闭。
    - 本 PR 只收口单窗原生关闭与退出；多窗口串行退出与混合顺序继续由 m1-serial-quit 处理。
  acceptance:
    - item: 前端覆盖无脏、确认丢弃、取消丢弃与多守卫竞争
      evidence: tests/bootstrap.test.ts 与 tests/host-services.test.ts
    - item: Rust 覆盖守卫就绪注册表；未就绪或全退订窗口不启用原生同步取消
      evidence: src-tauri/src/windows.rs 与 tests/host-services.test.ts
    - item: pnpm test、cargo test 与相关文档、流程、分层门禁通过
      evidence: 本仓门禁套件
