codeMap:
  - group: 知识层核心
    attention: must-read
    why: |
      状态判定、索引物化、schema 注入和源探测是本 PR 的行为心脏。
    files:
      - path: src/plugins/app-wiki/index-yaml.ts
        note: |
          机器索引 codec 是程序独占格式的唯一读写边界。
        changes:
          - snippet: |
              /** 机器索引 `.study-wiki/index.yaml` 的受限 yaml 子集解析/序列化。
              * 格式是 LF-only：解析器不归一化 CRLF，遇到 CR 按损坏输入拒绝。
              */

              /** 源类型：文本或视频。 */
              export type SourceKind = "text" | "video";
            note: |
              文件级注释声明 LF-only 输入合同，`SourceKind` 把源类型收窄为文本或视频，供记录、解析和序列化共用同一词表。
          - snippet: |
              /** 一条源记录：源 → 产物映射 + 内容哈希 + 分析时间。 */
              export interface SourceRecord {
              /** 库相对路径。 */
              path: string;
              /** 源类型：文本或视频（决定 ingest 路径）。 */
              kind: SourceKind;
              /** 源内容 SHA-256（小写 hex）。 */
              sha256: string;
              /** 文件大小（字节）。 */
              size: number;
              /** 最近一次分析完成时间（ISO）。 */
              analyzedAt: string;
              /** 产物目录（库相对路径）；文本源为 null（产物即源本身）。 */
              artifact: string | null;
              /** sources 页路径（库相对路径）；用于源迁址后仍把产物页与索引行绑定。 */
              page?: string;
              }
            note: |
              `SourceRecord` 固定六个必填字段，并用可选 `page` 绑定 sources 产物页；迁址后程序可凭页面路径找回同一索引行，而不依赖页面 frontmatter 的旧 source。
          - snippet: |
              /** 机器索引顶层结构。 */
              export interface MachineIndex {
              version: 1;
              sources: SourceRecord[];
              }
            note: |
              `MachineIndex` 只允许版本 1 和 `SourceRecord[]`，把索引形状锁在程序独占的单一版本上。
          - snippet: |
              const FIELDS = [
              "path",
              "kind",
              "sha256",
              "size",
              "analyzedAt",
              "artifact",
              ] as const;
              type Field = (typeof FIELDS)[number];
              const OPTIONAL_FIELDS = ["page"] as const;
              type OptionalField = (typeof OPTIONAL_FIELDS)[number];
              const ITEM_RE = /^  - ([a-zA-Z0-9]+): (.*)$/;
              const CONT_RE = /^    ([a-zA-Z0-9]+): (.*)$/;
              const INVALID_VALUE = Symbol("invalid value");
              type ParsedValue = string | number | null | typeof INVALID_VALUE;
            note: |
              `FIELDS` 与 `OPTIONAL_FIELDS` 是解析和序列化共享的封闭键集；两个正则只接受固定缩进的 `key: value` 行和续行，`INVALID_VALUE` 用哨兵区分“解析失败”和合法的 `null`。
          - snippet: |
              function unquote(raw: string): string | null {
              if (raw.length < 2 || !raw.startsWith('"') || !raw.endsWith('"')) return null;
              const inner = raw.slice(1, -1);
              let result = "";
              for (let index = 0; index < inner.length; index += 1) {
              const char = inner[index];
              if (char === '"') return null;
              if (char !== "\\") {
              result += char;
              continue;
              }
              const escaped = inner[index + 1];
              if (escaped !== "\\" && escaped !== '"') return null;
              result += escaped;
              index += 1;
              }
              return result;
              }
            note: |
              `unquote` 只接受双引号包裹的值，并且只解码反斜杠和双引号两种转义；未闭合引号、裸引号或不支持的转义都返回 `null`，避免手写解析器悄悄扩张成通用 YAML。
          - snippet: |
              function parseValue(
              field: Field | OptionalField,
              raw: string,
              ): ParsedValue {
              if (field === "artifact" && raw === "null") return null;
              if (field === "size") {
              if (!/^\d+$/.test(raw)) return INVALID_VALUE;
              const size = Number(raw);
              return Number.isSafeInteger(size) ? size : INVALID_VALUE;
              }
              if (field === "kind") {
              return raw === "text" || raw === "video" ? raw : INVALID_VALUE;
              }
              const value = unquote(raw);
              return value === null ? INVALID_VALUE : value;
              }
            note: |
              `parseValue` 按字段收窄标量：只有 `artifact` 接受裸 `null`，`size` 必须是非负安全整数，`kind` 只能是 text/video，其余字段继续走统一的双引号解码。
          - snippet: |
              /** 解析机器索引；任何偏离受限 yaml 子集的输入都返回 null。
              * @param text 机器索引文件文本。
              * @returns 解析结果；输入损坏时返回 null。
              */
              export function parseMachineIndex(text: string): MachineIndex | null {
              if (text.includes("\r")) return null;
              const lines = text.split("\n").filter((line) => line.trim() !== "");
              if (lines.length === 0) return null;
              if (lines[0] !== "version: 1") return null;
              const rest = lines.slice(1);
              if (rest.length === 0) return null;
              if (rest[0] === "sources: []") {
              return rest.length === 1 ? { version: 1, sources: [] } : null;
              }
              if (rest[0] !== "sources:") return null;
            note: |
              `parseMachineIndex` 在逐行解析前先拒绝 CR、空输入、错误版本头和非空列表形状；空索引必须精确写成 `sources: []`，其他偏差直接返回 `null`。
          - snippet: |
              const sources: SourceRecord[] = [];
              let current: Partial<
              Record<Field | OptionalField, string | number | null>
              > | null = null;
              const seen = new Set<Field | OptionalField>();
              const flush = (): boolean => {
              if (current === null) return true;
              if (!FIELDS.every((field) => seen.has(field))) return false;
              sources.push(current as SourceRecord);
              return true;
              };
            note: |
              `sources`、`current` 与 `seen` 共同保存逐记录解析状态；`flush` 只在上一条记录六个必填字段齐全时提交，可选 `page` 不改变必填字段门槛。
          - snippet: |
              for (const line of rest.slice(1)) {
              let match: RegExpMatchArray | null;
              const item = line.match(ITEM_RE);
              if (item) {
              if (!flush()) return null;
              current = {};
              seen.clear();
              match = item;
              } else {
              match = line.match(CONT_RE);
              if (match === null || current === null) return null;
              }
            note: |
              列表行开启新记录前先结算上一条；续行必须已有当前记录，否则把孤立续行或缺失分隔视为损坏输入。
          - snippet: |
              const key = match[1] as Field | OptionalField;
              if (
              (!(FIELDS as readonly string[]).includes(key) &&
              !(OPTIONAL_FIELDS as readonly string[]).includes(key)) ||
              seen.has(key)
              ) {
              return null;
              }
              const value = parseValue(key, match[2]);
              if (value === INVALID_VALUE) return null;
              seen.add(key);
              current[key] = value;
              }
              if (!flush()) return null;
              return { version: 1, sources };
            note: |
              键必须属于六个必填字段或 `page`，同一记录不得重复写键；任何值解析失败立即返回 `null`，循环结束后再结算最后一条记录，不返回半截索引。
          - snippet: |
              /** 序列化机器索引；输出可被 `parseMachineIndex` 恒等还原。
              * @param index 机器索引。
              * @returns 受限 yaml 子集文本。
              */
              export function serializeMachineIndex(index: MachineIndex): string {
              if (index === null || index.version !== 1 || !Array.isArray(index.sources)) {
              throw new Error("machine index must contain version 1 and a sources array");
              }
            note: |
              序列化入口先校验顶层版本和 `sources` 数组；运行时传入的坏对象 fail-fast，避免把不可表示状态写成看似合法的索引。
          - snippet: |
              for (const source of index.sources) {
              if (
              source === null ||
              (source.kind !== "text" && source.kind !== "video") ||
              !Number.isSafeInteger(source.size) ||
              source.size < 0 ||
              typeof source.path !== "string" ||
              typeof source.sha256 !== "string" ||
              typeof source.analyzedAt !== "string" ||
              (source.artifact !== null && typeof source.artifact !== "string") ||
              (source.page !== undefined && typeof source.page !== "string")
              ) {
              throw new Error("machine index contains an unrepresentable source");
              }
            note: |
              每条记录在渲染前逐字段核对类型、非负安全整数和可选 `page`；错误在写盘前抛出，防止坏值穿过程序边界。
          - snippet: |
              for (const value of [
              source.path,
              source.sha256,
              source.analyzedAt,
              source.artifact,
              source.page ?? null,
              ]) {
              if (value !== null && /[\n\r\u2028\u2029]/u.test(value)) {
              throw new Error("machine index strings must not contain line breaks");
              }
              }
              }
            note: |
              所有字符串字段（包括 `page`）都拒绝换行和 Unicode 行分隔符，避免值注入新的 YAML 行破坏固定格式。
          - snippet: |
              const quote = (value: string) =>
              `"${value.replace(/\\/g, "\\\\").replace(/"/g, '\\"')}"`;
              const lines = [`version: ${index.version}`, "sources:"];
            note: |
              `quote` 只转义反斜杠和双引号，和 `unquote` 的解码集合闭合；输出从固定版本头和 sources 头开始，不接受其他排版。
          - snippet: |
              for (const source of index.sources) {
              lines.push(`  - path: ${quote(source.path)}`);
              lines.push(`    kind: ${source.kind}`);
              lines.push(`    sha256: ${quote(source.sha256)}`);
              lines.push(`    size: ${source.size}`);
              lines.push(`    analyzedAt: ${quote(source.analyzedAt)}`);
              lines.push(
              `    artifact: ${source.artifact === null ? "null" : quote(source.artifact)}`,
              );
              if (source.page !== undefined) {
              lines.push(`    page: ${quote(source.page)}`);
              }
              }
              return `${lines.join("\n")}\n`;
            note: |
              每条记录按固定字段序和缩进写出，`page` 只在存在时追加；末尾换行保证输出再次经过 `parseMachineIndex` 时恒等可还原。
      - path: src/plugins/app-wiki/index.ts
        note: |
          插件装配把服务、prompt 贡献段和缓存失效事件接成生命周期。
        changes:
          - snippet: |
              import type { Context } from "cordis";
              import { createWikiService } from "./service";

              /** Plugin id in the manifest and the static module table. */
              export const name = "app-wiki";
              /** Service keys awaited before apply runs. */
              export const inject = ["agent", "files", "workspace"];
            note: |
              静态 id 与内置插件表对应，`inject` 声明启动前必须就绪的 agent、files 和 workspace 服务；它是依赖声明，不承担权限边界语义。
          - snippet: |
              export function apply(ctx: Context): () => void {
              const wiki = createWikiService({ files: ctx.files, workspace: ctx.workspace });
              ctx.reflect.provide("wiki", wiki);
              const unregister = ctx.agent.registerPromptSection(
              "wiki",
              (input) => wiki.contextSection(input),
              );
              const offRoot = ctx.workspace.events.on("root-changed", () => wiki.invalidate());
            note: |
              `apply` 先创建 wiki 服务并挂到 `ctx.wiki`，再把同一服务注册成 system prompt 贡献段；换根事件只触发缓存失效，打开文件由活动源服务按需处理。
          - snippet: |
              return () => {
              offRoot();
              unregister();
              };
              }
            note: |
              disposer 先解除换根监听，再注销 prompt 贡献段；顺序保证插件卸载后不再写入已释放的服务。
      - path: src/plugins/app-wiki/schema.ts
        note: |
          schema 是插件持有的 LLM 行为契约，不复制到库内。
        changes:
          - snippet: |
              /** llm-wiki 维护契约（schema v1）：插件持有的行为契约，经 prompt 贡献缝注入。
              * 设计约束：改 schema 即改 LLM 行为，不改代码；≤ 6000 字符（token 预算）；库内不复制本文件。 */

              /** llm-wiki 维护契约版本。 */
              export const WIKI_SCHEMA_VERSION = 1;
            note: |
              版本常量与契约全文同处插件源码；调整维护规则只需发布新的 schema 文本，不改变 agent 工具或提示拼接代码。
          - snippet: |
              /** llm-wiki 维护契约全文，注入 system prompt。 */
              export const WIKI_SCHEMA = `# llm-wiki 维护契约（schema v1）

              你是本学习库的 llm-wiki 维护者：你读 wiki，也写 wiki；用户只读（除非明确要求参与）。
            note: |
              契约开头先规定角色：agent 同时读写 wiki，用户默认只读；这样后续 ingest、query、lint 指令都在同一权限语义下解释。
          - snippet: |
              ## 结构约定
              - 库根下 \`.study-wiki/llm-wiki/\` 是你全权维护的 wiki 层；\`.study-wiki/index.yaml\` 与 \`.study-wiki/raw/\` 是程序维护的，绝对不要手改。
              - wiki 层布局：\`index.md\`（内容目录，每次操作后更新）、\`log.md\`（只追加的操作日志）、\`overview.md\`（全局综合判断）、\`sources/\`（每源一页）、\`concepts/\`、\`entities/\`。
              - 每个 wiki 页必须有 YAML frontmatter：
              ---
              title: 页面标题
              type: source | concept | entity
              source: 源库相对路径（仅 source 页必填）
              created: YYYY-MM-DD
              updated: YYYY-MM-DD
              confidence: high | medium | low
              related: ["其他页路径或 [[wikilink]]"]
              ---
              - 页间交叉引用用 [[wikilink]]；sources 页路径按 \`<源相对路径去扩展名>.md\` 嵌套镜像（如 \`sources/courses/rust/ownership.md\`）。
            note: |
              结构段把可写域限定在 `.study-wiki/llm-wiki/`，固定页面类型、frontmatter 和嵌套 sources 路径；程序维护的索引与 raw 明确禁止手改。
