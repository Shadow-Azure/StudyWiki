              assert_eq!(stale.sha256, full.sha256);
              std::fs::remove_dir_all(&dir).unwrap();
              }
            note: |
              size 与 known 不符时缓存失效，探针重新读取并得到真实哈希；这一分支证明快路径只接受 size 与 mtime 同时一致的样本。
