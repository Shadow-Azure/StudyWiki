  explanation: |
    图表达闭环而不是单向管道：agent 写 wiki 页面，页面作为产物证据让服务生成机器索引；下一回合索引和 probe 状态又作为 prompt 回到 agent。这样人工/LLM 只维护可读产物，程序负责可验证登记。
design: |
  约束是环境无关、无新运行时依赖、同版本行为一致，并且不能让 agent 手写派生索引。候选包括库内 schema、专用 wiki 工具、向量检索和程序性骨架初始化；最终选择插件内 schema + prompt 贡献缝 + 通用工具。代价是程序必须自己闭合证据、哈希、状态和移动语义。

  未初始化库不应因 prompt 构造产生空索引：无活动文件时不扫描、不探测、不写索引；活动源没有产物时也不新增空行，首次对话不会凭空创建 `.study-wiki/`。

  路径在服务边界统一用 `pathe` 归一：文件树节点保留 OS 原生形状，`toRel`、sources 根相对路径和 probe 缓存键仍得到 `/` 规范的库相对路径。这样 Windows 的 `\`、macOS/Linux 的 `/` 与混合输入都走同一套相对化逻辑，索引不因平台改变含义。

  #### 判定与索引闭环

  图 2 把判定序和索引物化拆开：同路径先给出 fresh/stale，内容哈希再识别 moved，最后才 unknown；索引行始终由现存产物证据驱动，损坏输入丢弃重建。这个顺序避免“移动后的同内容副本”被当成全新源。

  产物页绑定补上 moved 的持久化缺口：只改索引行时，页面里的旧 source 会在下一次打开把记录拉回旧路径。索引行因此保存实际页面路径，活动源解析先用它找到已重指的行，再从新路径取 size 与内容哈希；只有哈希仍匹配旧记录才刷新样本，迁址后再次修改内容会保持 stale。artifact 和分析时间继续保持旧值，不触发重分析。未打开源的旧索引行保持上次值，直到该源真正被打开。
