  explanation: |
    图表达闭环而不是单向管道：agent 写 wiki 页面，页面作为产物证据让服务生成机器索引；下一回合索引和 probe 状态又作为 prompt 回到 agent。这样人工/LLM 只维护可读产物，程序负责可验证登记。
design: |
  约束是环境无关、无新运行时依赖、同版本行为一致，并且不能让 agent 手写派生索引。候选包括库内 schema、专用 wiki 工具、向量检索和程序性骨架初始化；最终选择插件内 schema + prompt 贡献缝 + 通用工具。代价是程序必须自己闭合证据、哈希、状态和移动语义。

  未初始化库不应因 prompt 构造产生空索引：refresh 在没有产物且没有旧索引时直接返回，首次对话不会凭空创建 `.study-wiki/`。

  #### 判定与索引闭环

  图 2 把判定序和索引物化拆开：同路径先给出 fresh/stale，内容哈希再识别 moved，最后才 unknown；索引行始终由现存产物证据驱动，损坏输入丢弃重建。这个顺序避免“移动后的同内容副本”被当成全新源。
