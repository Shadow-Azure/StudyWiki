              //! 源文件探测：流式 SHA-256 + 大小 + mtime；known 命中（size + mtimeMs 一致）
              //! 时跳过哈希（视频大文件每回合重哈希不可接受）。错误带稳定 code，message 仅诊断。

              use serde::{Deserialize, Serialize};
              use sha2::{Digest, Sha256};
              use std::path::Path;

              const CHUNK: usize = 64 * 1024;
            note: |
              模块契约固定为流式哈希、稳定错误码和 64 KiB 块；known 快路径针对大视频反复探测的成本，错误 message 只用于诊断，调用方依赖 code。
          - snippet: |
              #[derive(Clone, Debug, Serialize, Deserialize)]
              #[serde(rename_all = "camelCase")]
              pub struct ProbeSample {
              pub size: u64,
              pub mtime_ms: i64,
              pub sha256: String,
              }
            note: |
              `ProbeSample` 是前后端交换的探针结果，camelCase 序列化与 TS 形状对齐；size、mtime 和哈希放在同一个样本里，状态判定不会混用不同时刻的元数据。
          - snippet: |
              #[derive(Debug, Serialize)]
              pub struct ProbeError {
              pub code: String,
              pub message: String,
              }

              fn err(code: &str, message: String) -> ProbeError {
              ProbeError {
              code: code.into(),
              message,
              }
              }
            note: |
              `ProbeError` 把稳定错误分类和诊断文本分开，`err` 统一构造错误；前端可以按 `code` 分支，而不解析 OS 错误字符串。
          - snippet: |
              /// 探测文件：返回大小、mtime（Unix 毫秒）与流式 SHA-256。known 提供且
              /// size/mtime 与磁盘一致时原样返回 known.sha256（快路径，不重读内容）。
              pub fn probe_file(path: &Path, known: Option<ProbeSample>) -> Result<ProbeSample, ProbeError> {
              if path
              .components()
              .any(|c| matches!(c, std::path::Component::ParentDir))
              {
              return Err(err(
              "PROBE_INVALID_PATH",
              format!("路径不得含 .. 组件：{}", path.display()),
              ));
              }
              let meta = std::fs::metadata(path).map_err(|e| {
              err(
              "PROBE_NOT_FOUND",
              format!("metadata {}: {e}", path.display()),
              )
              })?;
            note: |
              `probe_file` 在任何读盘前先拒绝 `..` 组件，随后读取 metadata；路径穿越和源不存在分别返回稳定错误码，权限仍由上层读授权负责。
          - snippet: |
              let size = meta.len();
              let mtime_ms = meta
              .modified()
              .map_err(|e| err("PROBE_STAT", format!("mtime {}: {e}", path.display())))?
              .duration_since(std::time::UNIX_EPOCH)
              .map(|d| d.as_millis() as i64)
              .unwrap_or(0);
              if let Some(known) = known {
              if known.size == size && known.mtime_ms == mtime_ms {
              return Ok(ProbeSample {
              size,
              mtime_ms,
              sha256: known.sha256,
              });
              }
              }
            note: |
              size 和毫秒 mtime 来自同一次 metadata 读取；known 的二者都一致时直接复用旧哈希，这是“未变文件不必重读”的快路径。
          - snippet: |
              let mut hasher = Sha256::new();
              let mut file = std::fs::File::open(path)
              .map_err(|e| err("PROBE_READ", format!("open {}: {e}", path.display())))?;
              use std::io::Read;
              let mut buf = vec![0u8; CHUNK];
              loop {
              let n = file
              .read(&mut buf)
              .map_err(|e| err("PROBE_READ", format!("read {}: {e}", path.display())))?;
              if n == 0 {
              break;
              }
              hasher.update(&buf[..n]);
              }
              Ok(ProbeSample {
              size,
              mtime_ms,
              sha256: format!("{:x}", hasher.finalize()),
              })
              }
            note: |
              known 未命中时按 64 KiB 块流式读取，内存上限固定；读完后输出小写十六进制摘要，哈希只覆盖文件内容，size 和 mtime 仍来自前面的 metadata。
