reviewGuide:
  order:
    - 先读 src/plugins/app-wiki/state.ts：确认 fresh/stale/moved/unknown 判定序和 reconcile 保留字段。
    - 再读 src/plugins/app-wiki/service.ts：检查产物证据、损坏索引、moved 重指和 prompt 有界性。
    - 接着读 src-tauri/src/probe.rs 与 lib.rs 注册段：确认授权边界、快路径和父目录创建。
    - 然后读 agent-core prompt/service 贡献缝：确认顺序、空白过滤、覆盖注册和注销语义。
    - 最后抽查 codec 与测试：坏输入必须返回 null 或稳定错误，快慢哈希必须一致。
  risks:
    - 同哈希多条记录时当前 find 取第一条；如果未来允许复制源，tie-break 不明确会重复或误指 moved。
    - 产物证据来自 sources 页与 mtime；若外部工具改写页面，分析时间会被当作新证据刷新。
    - 索引是程序独占但仍落在库内；如果 agent 绕过 schema 修改它，损坏重建会丢人工改动。
    - inject 不是权限边界；把它当白名单会高估外置插件的隔离强度，限制暴露面必须另设服务面 allowlist。
  acceptance:
    - item: schema 随 prompt 注入且有贡献段注册/注销
      evidence: tests/agent-prompt.test.ts；tests/agent-service.test.ts
    - item: 机器索引可解析/序列化且坏输入返回 null
      evidence: tests/app-wiki-index-yaml.test.ts
    - item: 源状态与产物证据 reconcile 可回归
      evidence: tests/app-wiki-state.test.ts；tests/app-wiki-service.test.ts（含 Windows 形状路径与活动源惰性索引 fake）
    - item: probe 快慢路径、路径拒绝和深目录写通过
      evidence: cargo test；src-tauri/src/lib.rs tests
    - item: 机械面和文档门禁全绿
      evidence: pnpm verify:commands；pnpm lint:docs；pnpm verify:docs
