              function markdownPaths(nodes: FileNode[]): string[] {
                const paths: string[] = [];
                for (const node of nodes) {
                  if (node.kind === "dir") {
                    paths.push(...markdownPaths(node.children ?? []));
                    continue;
                  }
                  if (node.path.endsWith(".md")) paths.push(node.path);
