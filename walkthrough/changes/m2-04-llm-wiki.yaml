              function unquote(raw: string): string | null {
                if (raw.length < 2 || !raw.startsWith('"') || !raw.endsWith('"')) return null;
                const inner = raw.slice(1, -1);
                let result = "";
                for (let index = 0; index < inner.length; index += 1) {
                  const char = inner[index];
                  if (char === '"') return null;
                  if (char !== "\\") {
                    result += char;
                    continue;
                  }
