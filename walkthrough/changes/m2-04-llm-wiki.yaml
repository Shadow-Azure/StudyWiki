kind: change
issue: m2-04-llm-wiki
title: llm-wiki 知识层（#31）
scale:
  files: 93
  additions: 7814
  deletions: 1380
feature: |
  这个分支把“知识复利”从想法变成可运行的知识层：agent 不新增 wiki 专用工具，而是在每回合收到插件发布的 schema、活动源状态和有界的 wiki 目录头部；它继续用 read/grep/write/edit 维护页面。程序侧只在打开源时探测该源并更新它自己的 `.study-wiki/index.yaml` 行，未打开源不扫描、不探测；源变更、移动和未分析都有确定状态，移动后的绑定也能跨回合保持。

  ![llm-wiki 数据流](../assets/m2-04-llm-wiki/knowledge-flow.svg)

  *图 1：从用户动作到 wiki 页面、机器索引与 system prompt 的闭环。*
userFlow:
  - 用户打开文本源并要求 agent 分析；系统通过 prompt 收到“活动文件尚未分析”，agent 先读原文。
  - agent 按确认的要点写入 sources/concepts/entities 页面；每次写仍走审批，目录不存在时由写命令自动创建。
  - 用户后续提问；agent 先读 llm-wiki/index.md 定位相关页，再带 [[wikilink]] 引用作答，未覆盖时明说并提议 ingest。
  - 用户修改源文件后提问；prompt 显示“已变更，请重新 ingest”，避免旧结论被当作最新知识。
  - 用户把源文件移动后提问；程序按相同内容哈希识别 moved，把索引行重指到新路径并按已分析继续回答，后续回合仍沿同一 sources 页识别。
  - 用户打开视频源；系统明确提示转录能力等待 m3，不伪造主题或时间戳。
architectural: |
  新增 `app-wiki` 内置插件发布 `ctx.wiki`，并经 `ctx.agent.registerPromptSection` 进入 system prompt；这保持了插件只经宿主服务的分层。wiki 页面由 agent 写，机器索引由服务独占写，二者通过现存产物证据关联。

  链路沿图 1：活动源经 files 服务进入 Rust probe；probe 返回 size/mtime/SHA-256，app-wiki 只更新这条活动源的索引行，再按同路径、同哈希、unknown 判定 fresh/stale/moved/unknown。状态、index 头部和 schema 组成 prompt 段，驱动下一轮 ingest/query/lint。

  打开源时，服务优先直取镜像约定的 sources 页，并把这条索引行绑定到实际页面路径。源移动后，页面 frontmatter 仍可能写旧路径；保存的 page 绑定让下一次打开直接探测索引里的新路径，保留哈希、大小与分析时间，避免回退成空记录。页面树只在 moved 旧页没有 page 绑定或未知源缺少约定页时作为回退。
