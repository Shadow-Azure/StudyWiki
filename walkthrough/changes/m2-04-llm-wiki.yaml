              get(path: string, fresh: ProbeSample): ProbeSample {
              const hit = map.get(path);
              if (hit && hit.size === fresh.size && hit.mtimeMs === fresh.mtimeMs) {
              return hit;
              }
              map.set(path, fresh);
              return fresh;
