      - path: scripts/walkthrough-review.mjs
        note: PR 检视 diff 数据层：numstat + 统一 diff hunk 解析 + 注解归位。
        changes:
          - snippet: |
              export function collectReviewDiff(root, base, deps = {}) {
                const exec = deps.exec ?? ((argv) => execFileSync("git", argv, { cwd: root, encoding: "utf8" }));
                const numstat = exec(["diff", "--numstat", `${base}...HEAD`])
                  .split("\n")
                  .filter(Boolean)
                  .map((line) => {
                    const [a, d, ...rest] = line.split("\t");
                    return { path: rest.join("\t"), additions: Number(a), deletions: Number(d) };
                  });
                const statuses = new Map(
                  exec(["diff", "--name-status", `${base}...HEAD`])
                    .split("\n")
                    .filter(Boolean)
                    .map((line) => {
                      const [status, ...rest] = line.split("\t");
                      return [rest.join("\t"), status];
                    }),
                );
            note: |
                检视数据层先注入可替换的 git 执行缝，再把 numstat 和 name-status 分别归一成增删统计与 A/D/M 状态映射，供后续覆盖率与 diff 页共用。
          - snippet: |
              /**
               * 解析统一 diff 文本为 hunk 数组（行号按 @@ 头推进）。
               * @param {string} diffText
               * @returns {Array<{oldStart: number, newStart: number, lines: DiffLine[]}>}
               */
              export function parseUnifiedDiff(diffText) {
                const hunks = [];
                for (const line of diffText.split("\n")) {
                  const head = /^@@ -(\d+)(?:,\d+)? \+(\d+)(?:,\d+)? @@/.exec(line);
                  if (head) {
                    hunks.push({ oldStart: Number(head[1]), newStart: Number(head[2]), lines: [] });
                    continue;
                  }
                  const hunk = hunks[hunks.length - 1];
                  if (!hunk) continue;
                  if (line.startsWith("+")) {
                    hunk.lines.push({ type: "add", text: line.slice(1), oldNo: null, newNo: nextNew(hunk) });
                  } else if (line.startsWith("-")) {
                    hunk.lines.push({ type: "del", text: line.slice(1), oldNo: nextOld(hunk), newNo: null });
            note: |
                统一 diff 解析器从 @@ 头建立 hunk 行号基准，并把 add/del 行推进到正确的 after/before 行号，为注解定位提供可靠坐标。
      - path: scripts/walkthrough-review.spec.mjs
        note: 数据层自测试（真实 git 夹具）。
        changes:
          - snippet: |
              describe("walkthrough-review 数据层", () => {
                it("解析统一 diff：行号与增删分类", () => {
                  const hunks = parseUnifiedDiff(SAMPLE);
                  expect(hunks).toHaveLength(2);
                  const [h1, h2] = hunks;
                  expect(h1.newStart).toBe(2);
                  expect(h1.lines.map((l) => l.type)).toEqual(["ctx", "del", "add", "add", "ctx"]);
                  expect(h1.lines[1].oldNo).toBe(3); // del 行取 before 行号
                  expect(h1.lines[2].newNo).toBe(3); // 第一行 add 的 after 行号
                  expect(h1.lines[3].newNo).toBe(4);
                  expect(h2.oldStart).toBe(20);
                  expect(h2.newStart).toBe(22);
                });

                it("注解按 after 行区间归位到所属 hunk", () => {
                  const hunks = parseUnifiedDiff(SAMPLE);
                  expect(hunkForRange(hunks, { start: 3, end: 4 })).toBe(0);
                  expect(hunkForRange(hunks, { start: 100, end: 101 })).toBe(-1);
                });
            note: |
                测试先锁定统一 diff 的行号与增删分类，再验证注解只在 after 区间命中所属 hunk，越界区间不能被误挂到第一个块。
      - path: scripts/build-walkthrough.spec.mjs
