  - feature: 保鲜与钩子
    title: pre-push 保鲜对账
    explanation: pre-push 前的保鲜对账检查从提交后 skill 对齐 commit id 开始；id 落后且中间有非 changes 提交才拦截并提示，仅元数据对账则放行。菱形两条出边一一对应该规则的拦截与容错出口。
    nodes:
