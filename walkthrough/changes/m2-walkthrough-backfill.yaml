    title: 流程三件套随批次落地
    explanation: LR 链表达流程件的伴生写作依赖：先登记 issue 三件套，再由 Agent Note 记录决策与校准，设计与计划文档随后修订，最后随同 PR 落地，避免流程件脱批。
    nodes:
