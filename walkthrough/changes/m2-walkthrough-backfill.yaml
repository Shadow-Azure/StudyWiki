reviewGuide:
  order:
    - walkthrough/manifest.json
    - walkthrough/changes/m2-walkthrough-backfill.yaml
    - walkthrough/changes/m2-03-basic-agent.yaml
    - walkthrough/features/agent-chat.yaml
    - walkthrough/files/src/plugins/agent-core/loop.ts.yaml
    - scripts/build-walkthrough.spec.mjs
  risks:
    - 90% 覆盖率只证明锚点覆盖行数，不证明讲解质量；重复片段或过大视窗仍可能通过门禁。
    - bootstrap 摘除后，旧的文件页、变更对账和覆盖率 WARN 立即转红；合入前必须按最终 diff 复核 scale 与全部页面。
    - 文件页 summary 必须与 code-map 登记逐字一致，手工润色一侧会造成静态对账失败。
  acceptance:
    - item: 全部门禁绿
      evidence: pnpm verify:walkthrough、pnpm walkthrough、pnpm test、pnpm verify:docs、pnpm verify:flow
    - item: bootstrap 摘除后，文件页、变更页与覆盖率三档由警告转全量红并通过
      evidence: walkthrough/manifest.json 与 node scripts/verify-walkthrough.mjs
    - item: 功能页、文件页和变更页 diff 通过维护者扫读，讲解“为什么/干什么”
      evidence: PR 人工 review 结论
verification:
  - node scripts/verify-walkthrough.mjs
  - node scripts/build-walkthrough.mjs
  - pnpm test（vitest）
  - pnpm build
  - pnpm verify:docs
  - pnpm verify:flow
touches:
  - feature:file-tree
  - feature:excel-view
  - feature:markdown-read
  - feature:plugin-load
  - feature:agent-chat
  - feature:multi-window
  - file:walkthrough/manifest.json
  - file:walkthrough/changes/m2-walkthrough-backfill.yaml
