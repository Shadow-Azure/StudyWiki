reviewGuide:
  order:
    - walkthrough/manifest.json
    - walkthrough/changes/m2-walkthrough-backfill.yaml
    - walkthrough/changes/m2-03-basic-agent.yaml
    - walkthrough/features/agent-chat.yaml
    - walkthrough/files/src/plugins/agent-core/loop.ts.yaml
    - scripts/build-walkthrough.spec.mjs
  risks:
    - 90% 覆盖率只证明锚点覆盖行数，不证明讲解质量；重复片段或过大视窗仍可能通过门禁。
    - bootstrap 摘除后，旧的文件页、变更对账和覆盖率 WARN 立即转红；合入前必须按最终 diff 复核 scale 与全部页面。
    - 文件页 summary 必须与 code-map 登记逐字一致，手工润色一侧会造成静态对账失败。
  acceptance:
    - item: 全部门禁绿
      evidence: pnpm verify:walkthrough、pnpm walkthrough、pnpm test、pnpm verify:docs、pnpm verify:flow
    - item: bootstrap 摘除后，文件页、变更页与覆盖率三档由警告转全量红并通过
      evidence: walkthrough/manifest.json 与 node scripts/verify-walkthrough.mjs
    - item: 功能页、文件页和变更页 diff 通过维护者扫读，讲解“为什么/干什么”
      evidence: PR 人工 review 结论
verification:
  - node scripts/verify-walkthrough.mjs
  - node scripts/build-walkthrough.mjs
  - pnpm test（vitest）
  - pnpm build
  - pnpm verify:docs
  - pnpm verify:flow
touches:
  - feature:file-tree
  - feature:excel-view
  - feature:markdown-read
  - feature:plugin-load
  - feature:agent-chat
  - feature:multi-window
  - file:walkthrough/manifest.json
  - file:walkthrough/changes/m2-walkthrough-backfill.yaml
architecturalFlowchart:
  title: 五层内容到机械保鲜的闭环
  explanation: 五层 YAML 源统一汇入 walkthrough-lib 共享事实源，先经源码锚点与行覆盖进入门禁，再由构建产出讲解静态站；LR 主链按消费顺序表达机械保鲜，「schema 与对账」强调校验是持续约束。
  nodes:
    - id: five-layer
      label: YAML 五层内容源
      shape: stadium
    - id: lib
      label: walkthrough-lib 共享事实源
    - id: anchors
      label: 源码锚点与行覆盖
    - id: gates
      label: verify-walkthrough 门禁
    - id: build
      label: build-walkthrough 构建
    - id: site
      label: 讲解静态站
      shape: rounded
  edges:
    - from: five-layer
      to: lib
    - from: lib
      to: anchors
    - from: anchors
      to: gates
    - from: lib
      to: gates
      label: schema 与对账
    - from: gates
      to: build
    - from: build
      to: site
designFlowcharts:
  - feature: 变更页机制与门禁
    title: 门禁事实源与自测试
    explanation: 封闭 schema 定义收敛到 walkthrough-lib 唯一事实源，verify-walkthrough 九条门禁与两条 spec 自测试都消费它；LR 主链表达依赖方向，绿或红统一由同一规则裁决。
    nodes:
      - id: schema
        label: 封闭 schema 定义
        shape: stadium
      - id: lib
        label: walkthrough-lib 唯一事实源
      - id: cli
        label: verify-walkthrough 九条门禁
      - id: pass
        label: 绿或红
        shape: diamond
      - id: specs
        label: 两条 spec 自测试
        shape: rounded
    edges:
      - from: schema
        to: lib
      - from: lib
        to: cli
        label: 消费同一事实源
      - from: cli
        to: pass
      - from: lib
        to: specs
  - feature: 渲染与检视模式
    title: 普通产物叠加本 PR 视角
    explanation: 事实源库数据经 build-walkthrough 多页渲染进入 --review 检视模式，walkthrough-review diff 数据层再叠加 numstat 与 hunk；单向 LR 链表达检视页不复制讲解内容，叙事仍来自单一事实源。
    nodes:
      - id: site-data
        label: 事实源库数据
        shape: stadium
      - id: render
        label: build-walkthrough 多页渲染
      - id: review
        label: --review 检视模式
      - id: git-diff
        label: walkthrough-review diff 数据层
      - id: page
        label: 本 PR 检视页
        shape: rounded
    edges:
      - from: site-data
        to: render
      - from: render
        to: review
      - from: git-diff
        to: review
        label: numstat 与 hunk
      - from: review
        to: page
  - feature: 内容回填
    title: 六批文件页与两类聚合页
    explanation: 六批文件页并行生成，features 功能页与 changes 变更页串行补齐；overview 与 architecture 先聚合叙事，manifest 定版阈值最后收口，因为覆盖率结论必须依赖全部页面完成。
    nodes:
      - id: batch
        label: 六批文件页并行生成
        shape: stadium
      - id: files
        label: walkthrough/files 注解页
      - id: features
        label: features 功能页
      - id: changes
        label: changes 变更页
      - id: meta
        label: overview 与 architecture
      - id: manifest
        label: manifest 定版阈值
        shape: rounded
    edges:
      - from: batch
        to: files
