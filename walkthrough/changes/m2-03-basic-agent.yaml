reviewGuide:
  order:
    - src/plugins/agent-core/loop.ts
    - src/plugins/agent-core/tools.ts
    - src/plugins/agent-core/approval.ts
    - src/plugins/agent-core/session.ts
    - src/plugins/app-agent/index.ts
    - src-tauri/src/grep.rs
  risks:
    - Guardian 审查有 90 秒超时和最多 3 次尝试；取消或切回必须停止旧审查并清空中断期请求，避免决定错挂到新回合。
    - auto 模式只放宽授权集合内的读取；write/edit 与越权读永远走审批，路径解析和回退不能绕过 workspace 根。
    - ripgrep sidecar 必须按 Rust target 固定版本并随包分发；遗漏目标或改用系统 rg 会破坏环境无关性。
  acceptance:
    - item: 与 agent 多轮对话可用；read/grep 能检索库与 wiki，write/edit 能落笔记
      evidence: tests/agent-loop.test.ts 与 tests/agent-tools.test.ts
    - item: 会话落盘为 JSONL，历史会话可恢复加载，发送新消息后继续
      evidence: tests/agent-session.test.ts
    - item: 写操作有请求批准/帮我批准；越授权读取经会话级审批，写入任何模式不可越界
      evidence: tests/agent-approval.test.ts 与 tests/agent-tools.test.ts
    - item: pnpm test、cargo test 与分层、环境无关性门禁绿
      evidence: 本仓门禁套件
