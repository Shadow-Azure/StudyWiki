feature: |
  用户在右栏与 agent 多轮对话；agent 能读取活动库内文件、用打包 ripgrep 检索、写新笔记或按 old/new 编辑文件。写操作与越权读取按 ask/auto 审批，人或 Guardian 给出决定；历史会话保存为 JSONL，重开后可恢复继续。
userFlow:
  - 打开右栏 agent，选择带 tools 能力的模型。
  - 让 agent 读取或检索活动库内文件；越授权集合的读取会进入审批。
  - 让 agent 写新笔记或按 old/new 编辑文件；在请求批准或帮我批准模式中给出决定。
  - 关闭后重开会话，恢复 JSONL 历史并继续追问。
architectural: |
  Agent 拆成无 UI 的 `agent-core` 服务插件与右栏 `app-agent` UI 插件：core 提供 `ctx.agent` 的回合状态机、四工具、审批、会话持久化和 compaction，UI 只消费快照与审批接管。工具协议使用 OpenAI 原生 function calling，`app-chat` 被统一取代。
