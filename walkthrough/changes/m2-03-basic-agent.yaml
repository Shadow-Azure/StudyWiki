              async function executeWrite(call: AgentToolCall, args: Record<string, unknown>, ctx: ToolRunContext): Promise<ToolResult> {
                const path = requiredString(args, "path");
                if (typeof path !== "string") return path;
                const content = requiredString(args, "content");
                if (typeof content !== "string") return content;
                if (!isWithinRoot(path, ctx.root)) return { content: "write 拒绝：目标路径不在库根内；写入永远不会越界。", isError: true };
                const approval = await askApproval(ctx, {
                  id: call.id,
                  kind: "write",
                  tool: "write",
                  path,
                  summary: `写入 ${content.length} 字符`,
                  preview: createTextPreview(content, content.length, countContentLines(content)),
                });
                if (!approval.ok) return approval.result;
                if (approval.value.decision === "deny") return denialResult(approval.value, "用户拒绝写入");

                await ctx.host.writeText(path, content);
                return { content: `已写入 ${path}` };
              }

              /** Bound one approval payload while preserving head and tail context. */
              function createTextPreview(
                text: string,
                totalCharacters: number,
                totalLines: number,
                omitted = text.length > MAX_APPROVAL_PREVIEW_CHARACTERS,
              ): ApprovalPreview {
                if (!omitted && text.length <= MAX_APPROVAL_PREVIEW_CHARACTERS) {
                  return { text, omitted: false, totalCharacters, totalLines };
                }
                const omittedCount = Math.max(0, text.length - MAX_APPROVAL_PREVIEW_CHARACTERS);
                const marker = `…（已省略 ${omittedCount} 字符）…`;
                const sideLength = Math.max(
                  0,
                  Math.floor((MAX_APPROVAL_PREVIEW_CHARACTERS - marker.length - 2) / 2),
                );
                const bounded = text.length <= MAX_APPROVAL_PREVIEW_CHARACTERS
                  ? text
                  : `${text.slice(0, sideLength)}\n${marker}\n${text.slice(-sideLength)}`;
                return { text: bounded, omitted: true, totalCharacters, totalLines };
              }

            note: |
                本次变更加入了 write 工具的库根检查和磁盘变化前审批：带长度受限的完整文本预览，只有明确允许后才写盘。

          - snippet: |
              async function executeEdit(call: AgentToolCall, args: Record<string, unknown>, ctx: ToolRunContext): Promise<ToolResult> {
                const path = requiredString(args, "path");
                if (typeof path !== "string") return path;
                const oldString = requiredString(args, "old_string");
                if (typeof oldString !== "string") return oldString;
                const newString = requiredString(args, "new_string");
                if (typeof newString !== "string") return newString;
                const replaceAll = optionalBoolean(args, "replace_all");
                if (oldString === "") return { content: "old_string 不能是空字符串。", isError: true };
                if (!isWithinRoot(path, ctx.root)) return { content: "edit 拒绝：目标路径不在库根内；写入永远不会越界。", isError: true };

                let currentForPreview: string | null = null;
                try {
                  currentForPreview = await ctx.host.readText(path);
                } catch {
                  // Preserve approval-then-read behavior: preview failures do not leak
                  // authorization errors or turn into execution results before approval.
                }
                const approval = await askApproval(ctx, {
                  id: call.id,
                  kind: "edit",
                  tool: "edit",
                  path,
                  summary: `文本替换（旧 ${oldString.length} 字符 · 新 ${newString.length} 字符）`,
                  preview: buildEditPreview(currentForPreview, oldString, newString),
                });
                if (!approval.ok) return approval.result;
                if (approval.value.decision === "deny") return denialResult(approval.value, "用户拒绝编辑");

                const current = await ctx.host.readText(path);
                const count = countOccurrences(current, oldString);
                if (count === 0) return { content: `未找到 old_string：${oldString}`, isError: true };
                if (count > 1 && replaceAll !== true) {
                  return { content: `old_string 匹配 ${count} 处；未设置 replace_all 时必须唯一。`, isError: true };
                }
                const next = replaceAll === true
                  ? current.split(oldString).join(newString)
                  : current.slice(0, current.indexOf(oldString)) + newString +
                    current.slice(current.indexOf(oldString) + oldString.length);

                await ctx.host.writeText(path, next);
                return { content: `已编辑 ${path}（替换 ${count} 处）` };
              }

            note: |
                本次变更加入了 edit 工具的审批与重读流程：预览失败不提前泄露授权错误，批准后重新读原文并按唯一或全部匹配写回。

      - path: src/plugins/agent-core/approval.ts
        note: 按 ask/auto 路由，处理 Guardian 超时、审查、取消与切回恢复。
        changes:
          - snippet: |
              /**
               * Create a pure approval gate that routes requests by the current mode.
               * @param deps Injected mode source, human approver, guardian chat client, and session logger.
               * @param guardianTimeoutMs Shared guardian review deadline in milliseconds; defaults to 90 seconds.
               * @param retry Parse failures and transient transport failures get bounded retries within the shared deadline; valid denials do not.
               * @returns A gate whose canceled approvals resolve fail-closed exactly once.
               */
              export function createApprovalGate(
                deps: {
                  mode: () => ApprovalMode;
                  askHuman: (req: ApprovalRequest) => Promise<ApprovalOutcome>;
                  chat: ApprovalChat;
                  log: (line: SessionLine) => void;
                },
                guardianTimeoutMs = GUARDIAN_REVIEW_TIMEOUT_MS,
                retry: {
                  maxRetries?: number;
                  sleep?: (ms: number) => Promise<void>;
                  interruptDrainMs?: number;
                } = {},
              ): ApprovalGate {
                const maxRetries = retry.maxRetries ?? GUARDIAN_MAX_REVIEW_ATTEMPTS - 1;
                const sleep = retry.sleep ?? ((ms: number) => new Promise<void>((resolve) => setTimeout(resolve, ms)));
                const pending = new Set<PendingApproval>();
                const interruptDrainMs = retry.interruptDrainMs ?? GUARDIAN_INTERRUPT_DRAIN_MS;

                function recordAndResolve(
                  entry: PendingApproval,
                  decision: "allow" | "deny" | "unavailable",
                  outcome: ApprovalOutcome,
                ): void {
                  if (entry.settled) return;
                  entry.settled = true;
                  pending.delete(entry);

                  const line: SessionLine = {
                    type: "approval",
                    id: entry.request.id,
                    kind: entry.request.kind,
                    tool: entry.request.tool,
                    path: entry.request.path,
                    decider: entry.decider,
                    decision,
                  };
                  if (outcome.reason !== undefined) line.reason = outcome.reason;
                  deps.log(line);
                  entry.resolve(outcome);
                }

                function track(
                  req: ApprovalRequest,
                  decider: ApprovalDecider,
                  source: Promise<ApprovalOutcome>,
                  abort?: () => void,
                ): Promise<ApprovalOutcome> {
                  return new Promise<ApprovalOutcome>((resolve) => {
                    const entry: PendingApproval = {
                      request: req,
                      decider,
                      resolve,
                      settled: false,
                      abort,
                    };
                    pending.add(entry);
                    void source.then(
                      (outcome) => recordAndResolve(entry, outcome.decision, outcome),
                      (cause: unknown) => recordAndResolve(entry, "deny", {
                        decision: "deny",
                        reason: describeError("审批失败：", cause),
                      }),
                    );
                  });
                }

                async function askHuman(req: ApprovalRequest): Promise<ApprovalOutcome> {
                  try {
                    return await deps.askHuman(req);
                  } catch (cause) {
                    return { decision: "deny", reason: describeError("人工审批失败：", cause) };
                  }
                }

                async function askGuardian(
                  req: ApprovalRequest,
                  controller: AbortController,
                ): Promise<ApprovalOutcome> {
                  const prompt = {
                    messages: [
                      { role: "system", content: GUARDIAN_SYSTEM_PROMPT },
                      {
                        role: "user",
                        content: guardianPayload(req),
                      },
                    ],
                  };
                  const startedAt = Date.now();
                  for (let attempt = 0; ; attempt += 1) {
                    const remaining = Math.max(0, guardianTimeoutMs - (Date.now() - startedAt));
                    let response: { content: string };
                    try {
                      response = await withGuardianDeadline(
                        deps.chat(prompt, controller.signal),
                        controller,
                        remaining,
                        interruptDrainMs,
                      );
                    } catch (cause) {
                      if (cause instanceof GuardianDeadlineError || attempt >= maxRetries ||
                        !isRetryableGuardianTransport(cause)) {
                        return { decision: "deny", reason: describeError("Guardian 审查失败：", cause) };
                      }
                      await sleep(Math.min(200 * 2 ** attempt, Math.max(0, remaining)));
                      continue;
                    }
                    const parsed = parseGuardianResponseWithStatus(response.content);
                    if (parsed.valid || attempt >= maxRetries) {
                      return parsed.outcome;
                    }
                    await sleep(Math.min(200 * 2 ** attempt, Math.max(0, remaining)));
                  }
                }

                return {
                  ask(req: ApprovalRequest): Promise<ApprovalOutcome> {
                    const guardianAllowed = deps.mode() === "auto" &&
                      guardianPayloadBytes(req) <= GUARDIAN_PAYLOAD_BUDGET_BYTES;
                    const decider: ApprovalDecider = guardianAllowed ? "guardian" : "human";
                    const controller = new AbortController();
                    const source = decider === "guardian"
                      ? askGuardian(req, controller)
                      : askHuman(req);
                    return track(req, decider, source, () => controller.abort(new Error("审批已取消")));
                  },
                  cancelAll(reason: string): void {
                    for (const entry of [...pending]) {
                      entry.abort?.();
                      recordAndResolve(entry, "unavailable", { decision: "deny", reason });
                    }
                  },
                };

            note: |
                本次变更加入了守门审查路由：每个请求包成悬挂记录，recordAndResolve 唯一结算；人工失败转拒绝，自动审查共享截止时间并受限重试。

