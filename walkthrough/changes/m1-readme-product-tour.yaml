reviewGuide:
  order:
    - 先读 README 中文与英文首页：核对价值表达、功能事实和双语结构。
    - 再读 Agent Note：确认选择视频、拒绝徽章堆叠与隔离截图的理由。
    - 打开首页图和 MP4：检查是否来自干净实例、字幕是否完整、旁白是否清晰。
    - 最后核对 #65 与本页：确认 scope、验收条目和实际证据一致。
  risks:
    - 界面或功能演进后静态媒体可能过时并误导访客；Agent Note 已要求大版本变化时重录。
    - MP4 增加仓库体积，当前文件约 5.4 MiB；后续更新应继续控制码率与时长，避免累积多个导览版本。
  acceptance:
    - item: README 中英镜像并通过预算、配对和链接门禁
      evidence: `pnpm lint:docs` 14 叶全绿
    - item: 截图来自当前 main 的隔离实例，视频含中文旁白与字幕
      evidence: 当前 main 提交 dcb2a57 构建的 StudyWiki.app；最终抽帧接触表与六段 MiMo ASR 校验
    - item: 文档、自测试与应用构建通过
      evidence: `pnpm exec vitest run --maxWorkers=4` 777/777；`pnpm tauri build --bundles app`
