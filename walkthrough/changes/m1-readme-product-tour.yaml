    - from: quickstart
      to: understand
  explanation: |
    本图只表达仓库访客的静态导览关系：README 是统一入口，首页图片与中文介绍视频、功能摘要与源码快速开始均为仓库内的展示或文档内容，运行中的 StudyWiki 不读取这些文件。采用一条 README 主入口，是因为两条了解路径都从首页出发：访客可沿首页图片进入中文介绍视频，直观理解产品工作流；也可先读功能摘要，再进入源码快速开始，从使用场景过渡到构建尝试。两条路径最终汇合，突出本 PR 只改善产品理解与上手引导，不涉及应用结构变化。
codeMap:
  - group: 首页叙事与决策
    attention: skim
    why: 文档决定访客如何理解产品，但不改变运行时行为，重点核对事实与双语一致性。
    files:
      - path: README.md
        note: 中文首页，串联价值定位、真实工作区、四类体验、源码构建与离线边界。
      - path: README.en.md
        note: 英文镜像，保持相同信息层级、链接与代码围栏。
      - path: .agents/notes/implemented/process/2026-10-30-readme-product-tour.md
        note: 记录首页结构、视频媒介与隔离截图的选型理由。
      - path: .agents/notes/implemented/process/2026-10-30-readme-product-tour.en.md
        note: 上述决策的英文镜像。
  - group: 展示媒体
