kind: change
issue: m1-readme-product-tour
skill_gen_commit_id: 7d45a6c
title: #65 README 产品化导览与中文介绍视频
scale:
  files: 12
  additions: 315
  deletions: 56
feature: |
  仓库访客可以从首页直接理解 StudyWiki 的学习工作流，查看真实应用工作区，并打开约一分钟的中文旁白视频。首页同时保留源码构建入口和离线边界，面向第一次接触项目的人建立准确预期。
userFlow:
  - 在 GitHub 打开 StudyWiki 仓库 → 首页先展示一句话定位与真实工作区 → 访客无需阅读架构文档即可判断产品形态。
  - 沿首页“四类连续体验”阅读 → 页面汇总阅读、整理、Agent 协作与知识扩展 → 访客找到与自己相关的使用场景。
  - 点击首页图片或视频链接 → 打开仓库内的 MP4 → 观看带中文字幕与旁白的 1080p 产品导览。
  - 无法播放视频时 → 继续阅读首页功能摘要与快速开始 → 不依赖外部媒体服务也能获得核心信息。
architectural: |
  无应用结构变化；改动只涉及仓库首页、展示媒体、流程与决策记录，不触及应用模块、接口或数据通路。媒体作为仓库静态资源由 README 直接引用，运行中的 StudyWiki 不读取这些文件。

  沿图「仓库首页与静态媒体导览」：仓库访客从 README 进入，首页图片通向中文介绍视频，功能摘要通向源码快速开始，两条路径都用于理解产品工作流。图只表达静态展示资源的引用关系，不表示应用内的数据流。
