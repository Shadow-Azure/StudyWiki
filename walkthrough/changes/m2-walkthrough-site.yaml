reviewGuide:
  order:
    - walkthrough/README.md
    - scripts/walkthrough-yaml.mjs
    - scripts/walkthrough-lib.mjs
    - scripts/build-walkthrough.mjs
    - scripts/verify-walkthrough.mjs
  risks:
    - 内容快照锚点按 trimEnd 后的首次命中定位；重复片段可能绑到同一文件更早位置，快照必须取语义完整边界。
    - bootstrap 只降级文件页、变更对账和覆盖率，schema、锚点、功能登记、构建与 diff 仍然红；绿灯不能掩盖 WARN 缺口。
    - 生成器必须保持 file:// 相对链接与资源复制可用，绝对路径或空资源处理会破坏离线产物。
  acceptance:
    - item: 解析器、规则库、校验器和构建器各有 spec，门禁规则有代表路径用例
      evidence: scripts/*.walkthrough*.spec.mjs、scripts/ci-wiring.spec.mjs
    - item: pnpm test、pnpm verify:docs、pnpm verify:flow 全绿
      evidence: 本仓门禁套件
    - item: pnpm walkthrough 构建成功，产物 file:// 下总览→架构→导航互链走通
      evidence: scripts/build-walkthrough.spec.mjs 与 pnpm walkthrough
    - item: 命令与 CI 登记新鲜
      evidence: pnpm verify:commands 与 .github/workflows/ci.yml
