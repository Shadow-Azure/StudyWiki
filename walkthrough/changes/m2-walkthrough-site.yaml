feature: |
  维护者和检视者可以构建离线讲解站，从总览、架构、功能、文件与变更史互跳；讲解站展示构建期真实源码，并由锚点把注解定位到当前代码，而不是依赖会漂移的复制粘贴。
userFlow:
  - 无用户面变化（开发流程）
architectural: |
  站点源是封闭 schema 的 YAML 五层结构：overview、architecture、features、files、changes。零依赖 YAML 子集解析器、共享校验库、九条门禁与静态构建器共同形成机制骨架；bootstrap 标志先把文件页、变更页和覆盖率缺口降级为 WARN，回填完成后再转硬门禁。
