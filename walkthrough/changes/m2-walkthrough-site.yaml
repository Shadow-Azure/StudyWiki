              async function appendReviewGates(root, options, result) {
                if (options.diffFiles === undefined || options.numstat === undefined) return;
                let issues = options.issues;
                if (issues === undefined) {
                  const { tree } = await loadFlowTree(path.join(root, ".agents/flow"));
                  issues = tree.issues
                    .filter((issue) => issue.data && typeof issue.data === "object")
                    .map((issue) => ({ slug: issue.name, status: issue.data.status }));
                }
                const activeSlugs = new Set(issues
                  .filter((issue) => issue.status === "in-progress")
                  .map((issue) => issue.slug));
                const reviewSlugs = options.diffFiles
                  .map((file) => /^walkthrough\/changes\/([^/]+)\.yaml$/u.exec(file)?.[1])
                  .filter(Boolean)
                  .filter((slug) => activeSlugs.has(slug));
                result.errors.push(...checkChangesSegments(root, siteOf(options), reviewSlugs));
                result.errors.push(...checkReviewCoverage(root, siteOf(options), options.numstat, reviewSlugs));
              }
            note: |
                review 专属硬门禁独立装配：只有 diff 与 numstat 同时注入时，才从 diff 变更页里筛出 in-progress issue 并检查段上限和覆盖率。
          - snippet: |
              export function readDiffFiles(base, exec = execFileSync) {
                return exec("git", ["diff", "--name-only", base + "...HEAD"])
                  .toString()
                  .split("\n")
                  .filter(Boolean);
              }

              /** 执行 `git diff --numstat base...HEAD` 并解析为行数组；exec 参数仅供测试注入。 */
              export function readNumstat(base, exec = execFileSync) {
                return parseNumstat(exec("git", ["diff", "--numstat", base + "...HEAD"]).toString());
              }

              /** 执行 `git diff --name-only --diff-filter=A base...HEAD`；exec 参数仅供测试注入。 */
              export function readAddedDiffFiles(base, exec = execFileSync) {
                return exec("git", ["diff", "--name-only", "--diff-filter=A", base + "...HEAD"])
                  .toString()
                  .split("\n")
                  .filter(Boolean);
              }
            note: |
                CLI 的 diff 文件、numstat 和新增页列表都是可注入读取函数；保持纯装配层薄，便于 leaf 测试替代 git 输出。
          - snippet: |
              if (import.meta.url === `file://${process.argv[1]}`) {
                const args = process.argv.slice(2);
                let diffIndex = -1;
                for (let index = 0; index < args.length; index += 1) {
                  if (args[index] === "--diff") {
                    diffIndex = index;
                    index += 1;
                    continue;
                  }
                  console.error(`未知参数: ${args[index]}`);
                  process.exit(2);
                }
                let diffFiles;
                let numstat;
                let addedDiffFiles;
                if (diffIndex >= 0) {
                  const base = args[diffIndex + 1];
                  if (!base) {
                    console.error("verify-walkthrough --diff 需要 <base> 参数（如 origin/main）");
                    process.exit(2);
            note: |
                CLI 参数只接受 --diff <base>；未知参数立即退出，基线缺失也给出用法，避免把装配错误伪装成站点内容错误。
  - group: 静态构建器
    attention: must-read
    why: 构建成功同时证明锚点可达和产物可离线打开。
    files:
      - path: scripts/build-walkthrough.mjs
        note: 渲染多页 file:// 可开的 HTML，并复制非空资源。
        changes:
          - snippet: |
              /**
               * 构建 walkthrough 多页静态站。
               * @param {string} root - 站点仓库根目录。
               * @param {string} [outDir] - 输出目录；默认解析到 root 下的 walkthrough/dist。
               * @returns {void} 构建成功时无返回值；多处锚点命中会向 stdout 输出 WARN。
               */
              let activeReviewNav = false;

              export function buildSite(root, outDir, options = {}) {
                activeReviewNav = Boolean(options.review);
                const resolvedRoot = path.resolve(root);
                const resolvedOut = path.resolve(outDir ?? path.join(resolvedRoot, "walkthrough/dist"));
                const site = parseSite(resolvedRoot);

                if (site.parseErrors.length > 0) {
                  throw new Error(`walkthrough 解析失败:\n  ${site.parseErrors.join("\n  ")}`);
                }
                const schemaErrors = validateSchema(site);
                if (schemaErrors.length > 0) {
                  throw new Error(`walkthrough schema 校验失败:\n  ${schemaErrors.join("\n  ")}`);
                }
                const anchorErrors = checkAnchors(resolvedRoot, site);
                if (anchorErrors.length > 0) {
                  throw new Error(`walkthrough 锚点校验失败:\n  ${anchorErrors.join("\n  ")}`);
                }

                site.codeMap = readCodeMap(resolvedRoot);
                site.root = resolvedRoot;

                rmSync(resolvedOut, { recursive: true, force: true });
                mkdirSync(resolvedOut, { recursive: true });
                const output = (relative, html) => {
                  const file = path.join(resolvedOut, relative);
                  mkdirSync(path.dirname(file), { recursive: true });
                  writeFileSync(file, html);
                };

                output("index.html", renderOverviewPage(site));
                output("architecture.html", renderSectionPage(site.architecture, "architecture.html", site, {
                  heading: "架构",
                  groupLabel: "架构",
                  target: "architecture.html",
                }));
                for (const [slug, feature] of site.features) {
                  output(`features/${slug}.html`, renderFeaturePage(slug, feature, `features/${slug}.html`, site));
                }
                for (const [source, page] of site.filePages) {
                  output(`files/${source}.html`, renderFilePage(source, page, `files/${source}.html`, site));
                }
                for (const [issue, change] of site.changes) {
                  output(`changes/${issue}.html`, renderChangePage(issue, change, `changes/${issue}.html`, site));
                if (options.review) {
                  output("review.html", renderReviewPage(site, options.review, root));
                }
                }

                const assets = path.join(resolvedRoot, "walkthrough/assets");
                if (existsSync(assets) && readdirSync(assets).length > 0) {
                  cpSync(assets, path.join(resolvedOut, "assets"), { recursive: true });
                }
              }

            note: |
                本次变更加入了静态站构建循环：先硬校验锚点，再渲染五层页面并复制非空资源，构建成功即证明产物可离线打开。

      - path: walkthrough/overview.yaml
        note: 总览页源。
      - path: walkthrough/architecture.yaml
        note: 架构页源。
  - group: 门禁接线与测试
    attention: skim
    why: 新检查接入既有编排，规则路径由 spec 钉住。
    files:
      - path: scripts/run-gates.mjs
        note: 登记 verify 与 build walkthrough 门禁。
      - path: scripts/route-gates.mjs
        note: 按 walkthrough 改动推荐门禁。
      - path: scripts/walkthrough-lib.spec.mjs
        note: schema、锚点、对账与 diff 规则用例。
      - path: scripts/build-walkthrough.spec.mjs
        note: 构建产物与导航用例。
      - path: scripts/ci-wiring.spec.mjs
        note: CI 接线回归。
  - group: 文档与站点骨架
    attention: skim
    why: 契约 home 与命令登记供维护者查找。
    files:
      - path: walkthrough/README.md
        note: schema 与十条门禁契约。
      - path: AGENTS.md
        note: 开发命令清单登记。
      - path: docs/AGENTS.md
        note: 文档层级与特殊例外登记。
      - path: package.json
        note: walkthrough 与 verify 命令入口。
reviewGuide:
  order:
    - walkthrough/README.md
    - scripts/walkthrough-yaml.mjs
    - scripts/walkthrough-lib.mjs
    - scripts/build-walkthrough.mjs
    - scripts/verify-walkthrough.mjs
  risks:
    - 内容快照锚点按 trimEnd 后的首次命中定位；重复片段可能绑到同一文件更早位置，快照必须取语义完整边界。
    - bootstrap 只降级文件页、变更对账和覆盖率，schema、锚点、功能登记、构建与 diff 仍然红；绿灯不能掩盖 WARN 缺口。
    - 生成器必须保持 file:// 相对链接与资源复制可用，绝对路径或空资源处理会破坏离线产物。
  acceptance:
    - item: 解析器、规则库、校验器和构建器各有 spec，门禁规则有代表路径用例
      evidence: scripts/*.walkthrough*.spec.mjs、scripts/ci-wiring.spec.mjs
    - item: pnpm test、pnpm verify:docs、pnpm verify:flow 全绿
      evidence: 本仓门禁套件
    - item: pnpm walkthrough 构建成功，产物 file:// 下总览→架构→导航互链走通
      evidence: scripts/build-walkthrough.spec.mjs 与 pnpm walkthrough
    - item: 命令与 CI 登记新鲜
      evidence: pnpm verify:commands 与 .github/workflows/ci.yml
verification:
  - pnpm test（vitest）
  - pnpm walkthrough
  - pnpm verify:walkthrough
  - pnpm verify:docs
  - pnpm verify:flow
  - pnpm verify:commands
touches:
  - file:scripts/walkthrough-yaml.mjs
  - file:scripts/walkthrough-lib.mjs
  - file:scripts/verify-walkthrough.mjs
  - file:scripts/build-walkthrough.mjs
  - file:scripts/run-gates.mjs
  - file:scripts/route-gates.mjs
  - file:walkthrough/README.md
architecturalFlowchart:
  title: YAML 源到静态站的机制骨架
  explanation: 表达讲解站的机制骨架：YAML 五层源先经零依赖解析器进入共享校验库，九条门禁与静态构建器消费同一事实源；门禁到构建的边强调“构建即校验”，产物不可能绕过门禁单独成立。
  nodes:
    - id: yaml-src
      label: 封闭 schema 的 YAML 五层源
      shape: stadium
    - id: parser
      label: 零依赖 YAML 子集解析器
    - id: lib
      label: 共享校验库
    - id: gates
      label: 九条门禁
    - id: build
      label: 静态构建器
    - id: site
      label: 多页静态站产物
      shape: rounded
  edges:
    - from: yaml-src
      to: parser
    - from: parser
      to: lib
    - from: lib
      to: gates
    - from: lib
      to: build
    - from: build
      to: site
    - from: gates
      to: build
      label: 构建即校验
