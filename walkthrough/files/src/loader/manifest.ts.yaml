source: src/loader/manifest.ts
summary: 插件清单装载：缺失时从模块表生成默认并写回 + 存量迁移（表新增内置行合并落盘），损坏 fail-loud
segments:
  - snippet: |
      /** One manifest row: which plugin, enabled or not, with what config. */
      export interface ManifestRow {
        id: string;
        enabled: boolean;
        config: Record<string, unknown>;
      }

      /** The whole persisted manifest. */
      export interface Manifest {
        plugins: ManifestRow[];
      }
    note: |
      ManifestRow 和 Manifest 定义磁盘契约：每行有 id、enabled 和 config，整体只是插件行数组。装载前后都按这个最小形状理解清单。
