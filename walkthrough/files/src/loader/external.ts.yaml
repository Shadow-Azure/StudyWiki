      装载成功时直接返回模块命名空间；失败也会离开 try 块。形状校验不在这里做，调用方 PluginsService.loadModule 负责契约检查。
  - snippet: |
      export async function loadExternalModule(
        code: string,
        importFn: (url: string) => Promise<Record<string, unknown>> = (url) => import(/* @vite-ignore */ url),
      ): Promise<Record<string, unknown>> {
        const blob = new Blob([code], { type: "text/javascript" });
        const url = URL.createObjectURL(blob);
        try {
          return await importFn(url);
        } finally {
          URL.revokeObjectURL(url);
        }
      }
    note: |
      finally 一定回收 object URL。加载结果已经在内存里，URL 不需要继续暴露，生命周期因此收敛在这次调用内。
