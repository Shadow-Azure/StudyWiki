source: src/boot-error.ts
summary: 启动错误面板：bootstrap 拒绝时向 #app 内联渲染错误与清理指引（替代白屏）
segments:
  - snippet: |
      /** bootstrap 拒绝时的最小可见出口：向 #app 内联渲染错误文本与清理指引，
       * 替代白屏；错误仍同时进 console。外置装载失败不走到这里（boot 分治为
       * 坏行），这里兜的是清单损坏、内置审计失败这类致命错。
       * @param error 拒绝原因（Error 或任意值）。 */
    note: |
      这是启动失败的最终可见出口：它只处理会让 bootstrap 中断的致命错误。外置插件的坏行在装载器里被单独隔离，因此不会抢占整个应用的白屏兜底路径。
  - snippet: |
      export function renderBootError(error: unknown): void {
        console.error("bootstrap 失败：", error);
        const app = document.querySelector<HTMLElement>("#app");
        if (!app) return;
    note: |
      导出入口先把原始拒绝原因写进 console，保留完整诊断线索。随后查找 #app，并在挂载点不存在时安静返回，避免错误面板自身再抛错。
  - snippet: |
      export function renderBootError(error: unknown): void {
        console.error("bootstrap 失败：", error);
        const app = document.querySelector<HTMLElement>("#app");
        if (!app) return;
        app.replaceChildren();
        const box = document.createElement("div");
        box.className = "boot-error";
        const title = document.createElement("h1");
    note: |
      确认可渲染后先清空旧 UI，再建立 boot-error 容器。这样失败页不会和半成品插件界面混在一起。
  - snippet: |
      export function renderBootError(error: unknown): void {
        console.error("bootstrap 失败：", error);
        const app = document.querySelector<HTMLElement>("#app");
        if (!app) return;
        app.replaceChildren();
        const box = document.createElement("div");
        box.className = "boot-error";
        const title = document.createElement("h1");
        title.textContent = "StudyWiki 启动失败";
        const detail = document.createElement("pre");
        detail.textContent = error instanceof Error ? error.message : String(error);
        const hint = document.createElement("p");
    note: |
      标题给用户一个明确结果，pre 用 textContent 展示 Error message 或任意值的字符串形式。不插入 HTML，避免错误内容被当作标记执行。
  - snippet: |
      export function renderBootError(error: unknown): void {
        console.error("bootstrap 失败：", error);
        const app = document.querySelector<HTMLElement>("#app");
        if (!app) return;
        app.replaceChildren();
        const box = document.createElement("div");
        box.className = "boot-error";
        const title = document.createElement("h1");
        title.textContent = "StudyWiki 启动失败";
        const detail = document.createElement("pre");
        detail.textContent = error instanceof Error ? error.message : String(error);
        const hint = document.createElement("p");
        hint.textContent = "可尝试：删除应用配置目录下损坏的 plugins.json（及 plugins/ 目录）后重启；或重新打开文件夹；或提交 issue 附上上方信息。";
        box.append(title, detail, hint);
        app.append(box);
      }
    note: |
      清理指引点名常见损坏文件和可重启、换目录、反馈 issue 的路径。最后一次性追加标题、详情和提示，让用户在无控制台时也能自救。
