        }

        /** Serialize a workbook and atomically write it through the files service. */
        async write(path: string, workbook: Workbook): Promise<void> {
          let bytes: Uint8Array;
          try {
            bytes = new Uint8Array(await workbook.xlsx.writeBuffer());
