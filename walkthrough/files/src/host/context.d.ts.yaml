          slots: SlotsService;
          /** 外置插件包管理 + 装载通道（plugin-manager 唯一消费者）。 */
          plugins: PluginsService;
          /** LLM 推理服务（endpoint 列表/探测/非流式与流式 chat；模型路由与能力门禁在本层）。 */
          llm: LlmService;
    note: 同一模块扩充还纳入 plugins、slots 与文件/数据/窗口能力，形成插件管理和 UI 槽位的公共类型出口。plugin-manager 与 shell 插件的主要消费者关系直接写在注释里。
