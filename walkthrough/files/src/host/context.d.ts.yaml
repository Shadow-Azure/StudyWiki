    note: 完整 Context 模块扩充把七个宿主服务与 agent 会话服务统一收口。agent 虽可被 Context 类型看到，但注释明确外置插件 guard 白名单不含它，编译面和行为边界一起成立。
  - snippet: |
      import type { Context } from "cordis";
      import type { FilesService } from "./files";
      import type { ExcelService } from "./excel";
      import type { WindowsService } from "./windows";
      import type { WorkspaceFacade } from "./workspace";
      import type { SlotsService } from "./slots";
      import type { PluginsService } from "./plugins";
      import type { LlmService } from "./llm";
      import type { AgentService } from "../plugins/agent-core/service";

      declare module "cordis" {
        interface Context {
          /** 文件通道（读树/读写文本/选目录/媒体 URL/fs 变更流）。 */
          files: FilesService;
          /** Excel 数据模型服务（xlsx 解析/序列化；人与 AI 共用读写面）。 */
          excel: ExcelService;
          /** 窗口身份/创建/原生确认框/关窗守卫。 */
          windows: WindowsService;
          /** 窗口 scope 工作区插件面（读/事件/守卫打开；换根仅经 windows 单路）。 */
          workspace: WorkspaceFacade;
          /** 类型化 UI 槽位注册表。 */
          slots: SlotsService;
          /** 外置插件包管理 + 装载通道（plugin-manager 唯一消费者）。 */
          plugins: PluginsService;
          /** LLM 推理服务（endpoint 列表/探测/非流式与流式 chat；模型路由与能力门禁在本层）。 */
          llm: LlmService;
          /** agent 会话服务（内置插件 agent-core 提供；外置插件 guard 白名单不含）。 */
          agent: AgentService;
        }
      }
    note: 完整文件视窗显示声明合并没有运行时代码，只服务编译期注入契约。这样服务实现保持互相独立，而消费代码能从同一 Context 类型发现可用宿主面。
