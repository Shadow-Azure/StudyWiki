kind: file-page
source: src/host/context.d.ts
summary: cordis Context 声明合并：七个宿主服务 + agent 会话服务类型挂入（workspace 只暴露插件 facade）
segments:
  - snippet: |
      import type { Context } from "cordis";
      import type { FilesService } from "./files";
      import type { ExcelService } from "./excel";
      import type { WindowsService } from "./windows";
      import type { WorkspaceFacade } from "./workspace";
      import type { SlotsService } from "./slots";
      import type { PluginsService } from "./plugins";
      import type { LlmService } from "./llm";
      import type { AgentService } from "../plugins/agent-core/service";
    note: 这一组 import 只为声明合并提供类型来源，不引入运行时代码。它把宿主服务、agent 会话服务和插件 facade 汇聚到一个编译期注册点，让后续 Context 上的服务访问获得统一类型。放在这里可以避免各服务实现互相知道 cordis。
  - snippet: |
      declare module "cordis" {
        interface Context {
          /** 文件通道（读树/读写文本/选目录/媒体 URL/fs 变更流）。 */
          files: FilesService;
          /** Excel 数据模型服务（xlsx 解析/序列化；人与 AI 共用读写面）。 */
          excel: ExcelService;
          /** 窗口身份/创建/原生确认框/关窗守卫。 */
          windows: WindowsService;
          /** 窗口 scope 工作区插件面（读/事件/守卫打开；换根仅经 windows 单路）。 */
          workspace: WorkspaceFacade;
          /** 类型化 UI 槽位注册表。 */
          slots: SlotsService;
    note: 模块扩充从 files、excel、windows 到 workspace/slots 逐步挂入服务类型。workspace 特意声明为 WorkspaceFacade，而不是内部 WorkspaceService，把插件可见面限制在读、事件、受守卫打开和守卫注册。
  - snippet: |
      declare module "cordis" {
        interface Context {
          /** 文件通道（读树/读写文本/选目录/媒体 URL/fs 变更流）。 */
          files: FilesService;
