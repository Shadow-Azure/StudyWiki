        async #route(model?: string): Promise<{ endpointId: string; model: string; entry: ModelEntry }> {
          const settings = await this.listEndpoints();
          const resolved = model ?? settings.defaultModel;
          if (!resolved) {
            throw new LlmError("MODEL_UNSPECIFIED", "未指定 model 且未配置默认模型");
          }
          const owners = settings.endpoints.filter(
            (e) => e.kind === "chat" && e.models.some((m) => m.id === resolved),
          );
          if (owners.length === 0) {
            throw new LlmError("MODEL_UNKNOWN", `未找到模型：${resolved}`);
          }
          if (owners.length > 1) {
            throw new LlmError("MODEL_AMBIGUOUS", `模型 ${resolved} 同时属于 ${owners.map((e) => e.id).join(", ")}`);
          }
          const entry = owners[0].models.find((m) => m.id === resolved)!;
          return { endpointId: owners[0].id, model: resolved, entry };
        }

        /** 解析转录模型归属：只路由 asr 类 endpoint，chat 配置不得误入转录命令。
         * @throws LlmError MODEL_UNKNOWN（无归属或无配置）/ MODEL_AMBIGUOUS（多归属或多候选未点名）。 */
        async #routeAsr(model?: string): Promise<{ endpointId: string; model: string }> {
          const settings = await this.listEndpoints();
          const asr = settings.endpoints.filter((e) => e.kind === "asr" && e.models.length > 0);
          if (model) {
            const owners = asr.filter((e) => e.models.some((m) => m.id === model));
            if (owners.length === 0) throw new LlmError("MODEL_UNKNOWN", `未找到 ASR 模型：${model}`);
            if (owners.length > 1) {
              throw new LlmError("MODEL_AMBIGUOUS", `模型 ${model} 同时属于 ${owners.map((e) => e.id).join(", ")}`);
            }
            return { endpointId: owners[0]!.id, model };
          }
          const candidates = asr.flatMap((e) => e.models.map((m) => ({ endpointId: e.id, model: m.id })));
          if (candidates.length === 0) throw new LlmError("MODEL_UNKNOWN", "未配置 ASR endpoint");
          if (candidates.length > 1) {
            throw new LlmError("MODEL_AMBIGUOUS", `存在多个 ASR 模型，请指定 model：${candidates.map((c) => c.model).join(", ")}`);
          }
          return candidates[0]!;
        }

        /** 非流式 chat：按 model 解析归属 endpoint，tools 能力门禁在本层后交 Rust 传输。
         * @throws LlmError MODEL_UNSPECIFIED（无 model 且无默认）/ MODEL_UNKNOWN（无归属）/ MODEL_AMBIGUOUS（多归属）/
         *   tools 不满足 UNSUPPORTED_CONTENT，其余传输码原样透传。 */
        async chat(req: ChatInput): Promise<ChatResult> {
          const { endpointId, model, entry } = await this.#route(req.model);
          if (req.tools?.length && !entry.capabilities.includes("tools")) {
            throw new LlmError("UNSUPPORTED_CONTENT", "当前模型不支持工具调用");
          }
          if (req.signal) {
            return await this.#consumeChatStream(await this.chatStream(req), req.signal);
          }
          return this.#call<ChatResult>("llm_chat", {
            req: {
              endpointId,
              model,
              messages: req.messages,
              ...(req.tools?.length ? { tools: req.tools } : {}),
              ...(req.maxTokens !== undefined ? { maxTokens: req.maxTokens } : {}),
              ...(req.temperature !== undefined ? { temperature: req.temperature } : {}),
            },
          });
        }

        /** 转录库根内音视频：Rust 侧按 endpoint protocol 分叉执行，本层只做 asr 路由。
         * @throws LlmError 路由 MODEL_* 与传输词表原样透传。 */
        async transcribe(req: { path: string; language?: string; model?: string }): Promise<TranscriptionResult> {
          const { endpointId, model } = await this.#routeAsr(req.model);
          return this.#call<TranscriptionResult>("llm_transcribe", {
            req: { endpointId, model, path: req.path, ...(req.language ? { language: req.language } : {}) },
          });
        }

        /** 是否存在至少一条带模型的 asr endpoint（agent 工具动态挂载依据）。 */
        async hasAsrCapability(): Promise<boolean> {
          const settings = await this.listEndpoints();
          return settings.endpoints.some((e) => e.kind === "asr" && e.models.length > 0);
        }

        /** Convert an abortable stream into the non-streaming result shape. */
        async #consumeChatStream(handle: ChatStreamHandle, signal: AbortSignal): Promise<ChatResult> {
          const abort = (): void => {
            void handle.abort().catch(() => {});
          };
          signal.addEventListener("abort", abort, { once: true });
          if (signal.aborted) abort();
          try {
            for await (const _chunk of handle.events) {
              if (signal.aborted) abort();
            }
            await handle.settled;
            const snapshot = handle.snapshot();
            if (!snapshot.finishReason) {
              throw new LlmError("BAD_RESPONSE", "模型响应缺少 finish reason");
            }
            return {
              content: snapshot.text,
              finishReason: snapshot.finishReason,
              ...(snapshot.usage ? { usage: snapshot.usage } : {}),
            };
          } finally {
            signal.removeEventListener("abort", abort);
          }
        }

        /** 流式 chat：模型路由与 tools/媒体能力门禁在本层，chunk 经 Tauri Channel 逐个交付。
         * settled 在正常终结 resolve；传输失败或 error chunk 终结时以 LlmError 拒绝。
         * @throws LlmError 路由 MODEL_*、tools 或媒体不满足 UNSUPPORTED_CONTENT，其余传输码原样透传。 */
    note: |
      这里解析模型归属并开放 chat 与转录两条路由。chat 只认 kind=chat；#routeAsr 只认 kind=asr，未点名且多候选时报 MODEL_AMBIGUOUS，没有配置时报 MODEL_UNKNOWN。transcribe 把 path/language 透传给 Rust，hasAsrCapability 决定工具是否挂载。
  - snippet: |
        /** 流式 chat：模型路由与 tools/媒体能力门禁在本层，chunk 经 Tauri Channel 逐个交付。
         * settled 在正常终结 resolve；传输失败或 error chunk 终结时以 LlmError 拒绝。
         * @throws LlmError 路由 MODEL_*、tools 或媒体不满足 UNSUPPORTED_CONTENT，其余传输码原样透传。 */
        async chatStream(req: ChatInput): Promise<ChatStreamHandle> {
          const { endpointId, model, entry } = await this.#route(req.model);
          if (req.tools?.length && !entry.capabilities.includes("tools")) {
            throw new LlmError("UNSUPPORTED_CONTENT", "当前模型不支持工具调用");
          }
          const needsVision = req.messages.some(
            (message) => Array.isArray(message.content) &&
              message.content.some((part) => part.type === "image"),
          );
          const needsAudio = req.messages.some(
            (message) => Array.isArray(message.content) &&
              message.content.some((part) => part.type === "audio"),
          );
          if ((needsVision && !entry.capabilities.includes("vision")) ||
            (needsAudio && !entry.capabilities.includes("audio"))) {
            throw new LlmError("UNSUPPORTED_CONTENT", "当前模型不支持请求中的媒体内容");
          }

          const streamId = crypto.randomUUID();
          const channel = this.#deps.createChannel!();
          const queue = new ChunkQueue();
          const assembler = new StreamAssembler();
          let seenError: Extract<StreamChunk, { type: "error" }> | null = null;
          channel.onmessage = (chunk) => {
            assembler.push(chunk);
            if (chunk.type === "error") seenError = chunk;
            queue.push(chunk);
          };

          const transport = this.#call<void>("llm_chat_stream", {
            req: {
              endpointId,
              model,
              messages: req.messages,
              streamId,
              ...(req.tools?.length ? { tools: req.tools } : {}),
              ...(req.maxTokens !== undefined ? { maxTokens: req.maxTokens } : {}),
              ...(req.temperature !== undefined ? { temperature: req.temperature } : {}),
            },
            onChunk: channel,
          });
          const settle = async (): Promise<void> => {
            try {
              await transport;
            } catch (error) {
              const normalized = error instanceof LlmError
                ? error
                : new LlmError("BAD_RESPONSE", String(error));
              queue.fail(normalized);
              throw normalized;
            }
            if (seenError) {
              const failure = new LlmError(seenError.code, seenError.message);
              queue.fail(failure);
              throw failure;
            }
            queue.close();
          };
          return {
            events: queue,
            snapshot: () => assembler.snapshot(),
            settled: settle(),
            abort: () => this.#call<void>("llm_chat_abort", { id: streamId }),
          };
        }
    note: |
      这里实现流式 chat：先做 tools/vision/audio 能力门禁，再创建 channel、维护中止与 settled 语义，把 chunk 逐个交给 UI，同时保留最终 finishReason 与 usage。
