       * @returns True while `text` differs from `savedText`. */
      export function isDirty(s: DocState): boolean {
        return s.text !== s.savedText;
      }
    note: |
      toggleMode 提供模式翻转，isDirty 用文本与基线的直接比较作守卫。两者都无副作用，方便关闭和切换前反复询问。
