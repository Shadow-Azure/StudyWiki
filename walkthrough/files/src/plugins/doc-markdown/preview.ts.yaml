kind: file-page
source: src/plugins/doc-markdown/preview.ts
summary: doc-markdown 兼容 re-export：消费方保留原导入路径并使用宿主共享 markdown 渲染器
segments:
  - snippet: |
      /** Compatibility re-export: doc-markdown uses the host-shared renderer contract.
       * 消费方保留原导入路径，doc-markdown 与 app-agent 使用同一安全策略。 */
      export { renderMarkdown } from "../../ui/markdown";
    note: |
      整份文件是一个兼容再导出：doc-markdown 不再自带 markdown 实现，而是使用宿主共享渲染器。保留原导入路径能让插件内部和既有消费方平滑迁移，不必一次性改散调用点。
