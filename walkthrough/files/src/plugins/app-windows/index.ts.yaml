      apply 返回槽位反订阅，两个按钮的生命周期随 Activity Rail 槽位管理。打开文件夹先等到用户真的选择 root，再走 windows.changeRoot 的授权与登记单路；新建窗口显式携带当前 root 或 undefined，让新窗口落入欢迎态。
