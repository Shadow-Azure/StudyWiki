kind: feature
slug: multi-window
title: 多窗口与关窗守卫
behavior: |
  活动栏可新建窗口并携带当前库根；每个窗口拥有自己的工作区状态。有关未保存内容时，红点、Cmd+Q 或窗口关闭会先取消原生动作，聚合守卫逐项确认后才销毁窗口或退出应用。

modules: [src/plugins/app-windows/index.ts, src/host/windows.ts, src-tauri/src/windows.rs, src-tauri/src/native_close.rs, src-tauri/src/lib.rs, src/host/workspace.ts]
