                    state.lock().unwrap().remove(&label);
                    return Err(format!("授权 asset 访问 {root} 失败：{e}"));
                }

    note: |
        Rust 先登记 label→root 并授予该目录 asset scope；授权失败回滚登记，不留下不可用窗口。

