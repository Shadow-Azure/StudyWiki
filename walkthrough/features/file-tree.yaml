kind: feature
slug: file-tree
title: 文件树浏览
behavior: |
  打开学习库后，侧栏按目录展示文件树；用户可折叠或展开目录、手动刷新，并点击 Markdown、Excel 或视频文件打开对应阅读面。当前文件会持续高亮，文件系统变化时树自动重读。

modules: [src/host/files.ts, src/host/workspace.ts, src/plugins/view-filetree/index.ts, src/plugins/view-filetree/tree.ts, src/types.ts]
