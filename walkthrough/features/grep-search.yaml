kind: feature
slug: grep-search
title: Agent grep 工具
behavior: |
  Agent 可在库根或已授权路径执行文本搜索，支持正则或原文、忽略大小写、glob、上下文和命中上限。Rust 使用随应用打包的 ripgrep sidecar，流式解析 JSON 输出，并按字节、空闲超时与数量预算提前停止。

modules: [src/plugins/agent-core/tools.ts, src/host/files.ts, src-tauri/src/lib.rs, src-tauri/src/grep.rs, src-tauri/src/windows.rs]
steps:
  - ref:
      file: src/plugins/agent-core/tools.ts
      snippet: |
