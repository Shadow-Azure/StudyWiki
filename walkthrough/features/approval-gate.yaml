kind: feature
slug: approval-gate
title: 审批门
behavior: |
  Agent 的写入或越权读先形成带预览的审批请求；ask 模式接管输入区由用户决定，auto 模式在预算内交给 Guardian 审查。决定与理由写入会话日志，取消或审查失败一律 fail-closed。

modules: [src/plugins/agent-core/tools.ts, src/plugins/agent-core/approval.ts, src/plugins/agent-core/service.ts, src/plugins/app-agent/index.ts, src-tauri/src/llm.rs]
steps:
