kind: feature
slug: video-play
title: 视频播放
behavior: |
  选中视频文件后阅读面创建原生 controls 播放器，经 asset protocol 加载本地媒体；可用空格播放暂停、左右键快退快进，加载中与失败分别显示状态提示。

