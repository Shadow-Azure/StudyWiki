kind: feature
slug: agent-chat
title: Agent 对话与回合
behavior: |
  右栏 Agent 面板可新建、切换和搜索会话；发送后先显示用户消息，再流式呈现推理、回答与工具过程。回合可排队、停止或出错恢复，完整事件落成 JSONL，崩溃尾行下次打开时安全丢弃。

modules: [src/plugins/app-agent/index.ts, src/plugins/agent-core/service.ts, src/plugins/agent-core/loop.ts, src/host/llm-stream.ts, src/plugins/agent-core/session.ts]
steps:
  - ref:
      file: src/plugins/app-agent/index.ts
      snippet: |
        const sendDraft = (): void => {
            if (disposed || !input) return;
            if (!session) {
              pendingSend = true;
              return;
            }
            const text = input.value.trim();
            if (!text && attachments.length === 0) return;
            if (session && session.model !== selectedModel) session.setModel(selectedModel);
            const content = composeContent(text, attachments);

            if (turnRunning || session.running) {
              queueSequence += 1;
              const preview = text || attachments.map((attachment) => attachment.label).join("、");
              messageQueue.push({
                id: `queue-${queueSequence}`,
                text,
                content,
                preview,
              });
              input.value = "";
              attachments = [];
              renderChips();
              renderQueue();
              paintButtons();
              return;
            }

            const outgoingContent = attachments.length > 0 ? content as ContentPart[] : undefined;
            attachments = [];
            input.value = "";
            renderChips();
            if (notice) notice.hidden = true;
            sendMessage(session, text, content, outgoingContent);
          };
    note: |
        sendDraft 先同步清空 composer 和附件 chips；运行中入队并刷新队列，空闲时交给 sendMessage 发起并渲染回合。

