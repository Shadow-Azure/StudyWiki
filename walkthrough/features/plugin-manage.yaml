kind: feature
slug: plugin-manage
title: 外置插件管理
behavior: |
  插件面板列出内置与外置插件及其运行、失败或待清理状态；可按包名安装、导入本地 tgz、启停、重载、回退历史版本或移除外置插件。动作即时作用于当前窗口，清单写回后供其他窗口重启跟随。

modules: [src/plugins/plugin-manager/index.ts, src/plugins/plugin-manager/model.ts, src/host/plugins.ts, src/loader/activate.ts, src-tauri/src/plugins.rs]
steps:
  - ref:
      file: src/plugins/plugin-manager/index.ts
      snippet: |
        async function openPanel(ctx: Context, opener: HTMLButtonElement): Promise<void> {
          document.querySelector(".plugin-panel")?.remove();
          const overlay = document.createElement("div");
          overlay.className = "plugin-panel";
          overlay.setAttribute("role", "dialog");
          overlay.setAttribute("aria-modal", "true");
          overlay.setAttribute("aria-label", "插件管理");
          const box = document.createElement("div");

    note: |
        安装不是只落目录：面板写入启用清单、读取校验模块，并走热重载路径让新插件立刻生效。

