kind: feature
slug: markdown-read
title: Markdown 阅读与编辑
behavior: |
  点击 Markdown 文件后默认进入安全预览；用户可切换编辑模式获得 CodeMirror 编辑器，修改会即时标脏，Mod-S 或保存按钮写回原文件。读取、保存失败和切换关闭都会给出可见反馈。

modules: [src/host/files.ts, src/plugins/doc-markdown/index.ts, src/plugins/doc-markdown/mode.ts, src/plugins/doc-markdown/editor.ts, src/ui/markdown.ts, src/ui/viewer.ts]
