kind: feature
slug: attachments
title: 附件三源
behavior: |
  Agent 消息支持 inline、path 和 url 三种媒体来源；当前 composer 可粘贴或拖入图片/音频生成 inline 附件，Rust 出口再归一 path/url、检查模型能力和单件/总量大小，最后构建 OpenAI 兼容多模态请求。

modules: [src/plugins/app-agent/attachments.ts, src/plugins/app-agent/index.ts, src/plugins/agent-core/service.ts, src-tauri/src/llm.rs]
