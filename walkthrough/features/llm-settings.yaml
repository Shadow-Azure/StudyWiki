kind: feature
slug: llm-settings
title: LLM endpoint 配置
behavior: |
  模型面板可从厂商预设实例化 endpoint，也可自定义 OpenAI 兼容地址；表单校验通过后经宿主服务交给 Rust 保存，apiKey 只在配置文件中保留并对外脱敏。用户可设默认模型、按需揭示明文并探测 GET /models。

modules: [src/plugins/llm-settings/index.ts, src/plugins/llm-settings/model.ts, src/host/llm.ts, src-tauri/src/llm.rs, src-tauri/src/config.rs]
steps:
  - ref:
      file: src/plugins/llm-settings/model.ts
      snippet: |
        export function validateDraft(d: EndpointDraft): string | null {
          if (!d.id.trim()) return "id 不能为空";
          if (!d.name.trim()) return "name 不能为空";
          if (!(d.baseUrl.startsWith("http://") || d.baseUrl.startsWith("https://"))) {
            return "baseUrl 必须以 http:// 或 https:// 开头";
          }
          if (d.models.length === 0) return "至少要有一个模型";

    note: |
        前端先给表单点名错误；空 apiKey 合法，便于自托管服务或稍后补 key。

  - ref:
      file: src/plugins/llm-settings/index.ts
      snippet: |
