<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 390" role="img" aria-labelledby="title desc">
  <title id="title">llm-wiki 数据流</title>
  <desc id="desc">从用户与 agent 出发，经 app-wiki 服务、files 服务与 probe 命令，连接机器索引、wiki 页面和 system prompt。</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <path d="M0,0 L10,3.5 L0,7 Z" fill="#5454d4"/>
    </marker>
  </defs>
  <g font-family="system-ui, sans-serif" font-size="15">
    <rect x="20" y="35" width="145" height="58" rx="12" fill="#f4f4fb" stroke="#5454d4"/>
    <text x="92" y="59" text-anchor="middle">用户动作</text>
    <text x="92" y="80" text-anchor="middle">分析 / 提问 / lint</text>
    <rect x="20" y="155" width="145" height="58" rx="12" fill="#f4f4fb" stroke="#5454d4"/>
    <text x="92" y="179" text-anchor="middle">agent</text>
    <text x="92" y="200" text-anchor="middle">通用四工具</text>
    <rect x="245" y="115" width="165" height="66" rx="12" fill="#eaf7ee" stroke="#2da44e"/>
    <text x="327" y="141" text-anchor="middle">app-wiki 服务</text>
    <text x="327" y="163" text-anchor="middle">状态 + 索引刷新</text>
    <rect x="500" y="40" width="155" height="58" rx="12" fill="#f4f4fb" stroke="#5454d4"/>
    <text x="577" y="64" text-anchor="middle">Rust probe 命令</text>
    <text x="577" y="85" text-anchor="middle">size + mtime + SHA-256</text>
    <rect x="500" y="145" width="155" height="58" rx="12" fill="#fff8e6" stroke="#b7791f"/>
    <text x="577" y="169" text-anchor="middle">机器索引</text>
    <text x="577" y="190" text-anchor="middle">.study-wiki/index.yaml</text>
    <rect x="500" y="250" width="155" height="58" rx="12" fill="#eaf7ee" stroke="#2da44e"/>
    <text x="577" y="274" text-anchor="middle">wiki 页面</text>
    <text x="577" y="295" text-anchor="middle">sources / concepts / log</text>
    <rect x="735" y="145" width="155" height="58" rx="12" fill="#f4f4fb" stroke="#5454d4"/>
    <text x="812" y="169" text-anchor="middle">system prompt</text>
    <text x="812" y="190" text-anchor="middle">状态 + schema</text>
    <line x1="92" y1="93" x2="92" y2="150" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="165" y1="184" x2="239" y2="160" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="140" x2="492" y2="75" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="655" y1="80" x2="735" y2="145" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="160" x2="492" y1="170" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="410" y1="180" x2="492" y2="270" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="577" y1="250" x2="577" y2="208" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="890" y1="174" x2="890" y2="174" stroke="#5454d4" stroke-width="2"/>
    <line x1="735" y1="185" x2="175" y2="200" stroke="#9a9af5" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="445" y="348" text-anchor="middle" fill="#57606a">实线是数据/调用，虚线表示 prompt 把机器状态带回 agent。</text>
  </g>
</svg>
