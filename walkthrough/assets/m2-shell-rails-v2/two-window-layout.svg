<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" role="img" aria-labelledby="title desc">
  <title id="title">双窗口布局同步</title>
  <desc id="desc">窗口 A 拖动侧栏后保存 localStorage，窗口 B 收到 storage 事件后重读布局；窗口 B 正在拖动时先忽略该事件。</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 Z" fill="#5454d4"/>
    </marker>
  </defs>
  <rect x="30" y="48" width="300" height="170" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="180" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#24292f">窗口 A</text>
  <rect x="58" y="108" width="64" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <rect x="138" y="108" width="72" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <rect x="226" y="108" width="76" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <text x="174" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#24292f">拖动文件栏</text>
  <text x="174" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">pointerup 后持久化一次</text>

  <rect x="590" y="48" width="300" height="170" rx="14" fill="#f6f8fa" stroke="#57606a" stroke-width="2"/>
  <text x="740" y="82" text-anchor="middle" font-family="system-ui, sans-serif" font-size="17" font-weight="600" fill="#24292f">窗口 B</text>
  <rect x="618" y="108" width="64" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <rect x="698" y="108" width="72" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <rect x="786" y="108" width="76" height="72" rx="8" fill="#fff" stroke="#5454d4"/>
  <text x="734" y="153" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#24292f">收到 storage</text>
  <text x="734" y="198" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">不在拖拽则重读并重绘</text>

  <rect x="335" y="92" width="250" height="82" rx="14" fill="#eef0ff" stroke="#5454d4" stroke-width="2"/>
  <text x="460" y="124" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" fill="#24292f">studywiki.shell-layout.v1</text>
  <text x="460" y="150" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">version + files + agent</text>
  <line x1="330" y1="133" x2="335" y2="133" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="585" y1="133" x2="590" y2="133" stroke="#5454d4" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="210" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" fill="#57606a">最后写入者获胜</text>

  <rect x="245" y="286" width="430" height="88" rx="14" fill="#fff8f0" stroke="#bf8700" stroke-width="2"/>
  <text x="460" y="320" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#24292f">损坏、缺字段或超版本</text>
  <text x="460" y="348" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#57606a">归一化逐字段回退默认值，不阻断 shell</text>
</svg>
