name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend-and-docs:
    # 静态 lane：文档门禁内嵌在这里（doc-sync 全量），代码与文档没有旁路。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 门禁自测试（vitest）
        run: pnpm test
      - name: TypeScript + Vite 构建
        run: pnpm build
      - name: 文档门禁（doc-sync，含产物扫描）
        run: pnpm verify:docs

  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
          - os: ubuntu-latest
          - os: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 格式
        run: cargo fmt --check
        working-directory: src-tauri
      - name: 静态分析（warning 即失败）
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: 测试
        run: cargo test
        working-directory: src-tauri
